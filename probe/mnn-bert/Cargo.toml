# A2 探针（复用 vendored MNN 跑 BERT）。**独立工程，不进主仓库构建**。
# 判据先写死在 README.md；构建/链接需要 MNN_PROBE_INCLUDE / MNN_PROBE_LIB。
[package]
name = "mnn-bert-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenizers = "0.23"   # 与 fastembed 同一个 tokenizer.json，保证输入一致
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"          # 在 fastembed 缓存里找 onnx/tokenizer 快照目录

[build-dependencies]
cc = "1"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
