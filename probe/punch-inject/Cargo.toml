[package]
name = "punch-inject-probe"
version = "0.1.0"
edition = "2021"
publish = false

# 与主工程同版本（Cargo.toml:71 iroh 1.1），共享 cargo 缓存。
# unstable-custom-transports：E3 用的官方数据面注入口（unstable）。
[dependencies]
iroh = { version = "=1.1.0", default-features = false, features = [
    "tls-ring",
    "portmapper",
    "unstable-custom-transports",
    "test-utils",
] }
iroh-base = { version = "=1.1.0", default-features = false }
# poll_recv 签名需要 RecvMeta（必须与 iroh 1.1.0 锁定的 1.2.0 同版本，类型才一致）
noq-udp = { version = "=1.2.0", default-features = false }
n0-watcher = "1.0"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
