<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>二维码双向编辑器（生成 + 识图解码）· 设计稿（对照 QRCodeDialog / jsqr / TransformHub）</title>
<style>
  :root{
    --app-bg:#F7F7F8; --card-bg:#fff; --dialog-bg:#fff; --section-bg:#F0F4F8;
    --text-primary:#0F172A; --text-secondary:#495565; --text-muted:#627083;
    --border-color:#E0E4EB; --accent:#0284C7; --accent-light:#E0F2FE; --accent-strong:#0273AD;
    --hover:#E8ECF2;
    --green:#11813A; --red:#D82525;
    --glass-popover-shadow:0 12px 36px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--app-bg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text-primary);display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center;min-height:100vh;padding:24px;}

  .dialog-backdrop{position:relative;background:rgba(0,0,0,.35);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0;}
  .dialog-box{background:var(--dialog-bg);border:1px solid var(--border-color);border-radius:16px;
    display:flex;flex-direction:column;box-shadow:var(--glass-popover-shadow);}
  .dialog-box.w420{width:420px;max-height:86vh;}
  .dialog-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;flex-shrink:0;border-bottom:1px solid var(--border-color);}
  .dialog-title{font-size:15px;font-weight:600;}
  .dialog-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);font-size:16px;}

  .code-meta-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border-color);font-size:11px;color:var(--text-muted);}
  .code-meta-bar .spacer{flex:1;}
  .md-mode-toggle{display:inline-flex;border:1px solid var(--border-color);border-radius:8px;overflow:hidden;background:var(--section-bg);}
  .md-mode-toggle button{border:none;background:transparent;padding:4px 12px;font-size:11px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
  .md-mode-toggle button.active{background:var(--accent);color:#fff;}

  .qr-body{display:flex;flex-direction:column;gap:12px;padding:14px 16px;flex:1;overflow:auto;}
  .qr-text{flex:1;min-height:90px;border:1px solid var(--border-color);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:var(--text-primary);background:var(--card-bg);resize:vertical;}
  .qr-canvas-wrap{position:relative;align-self:center;background:#fff;border:1px solid var(--border-color);border-radius:12px;padding:12px;}
  .qr-canvas-wrap canvas{display:block;width:240px;height:240px;}
  .qr-badge{display:inline-flex;align-self:center;font-size:11px;font-weight:700;color:var(--accent-strong);background:var(--accent-light);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);padding:2px 10px;border-radius:6px;}
  .qr-note{font-size:10px;color:var(--text-muted);line-height:1.5;text-align:center;}

  /* 识图区 */
  .qr-drop{align-self:stretch;border:1.5px dashed var(--border-color);border-radius:12px;background:var(--section-bg);padding:22px;text-align:center;cursor:pointer;color:var(--text-secondary);font-size:12px;line-height:1.6;}
  .qr-drop:hover{border-color:var(--accent);color:var(--accent);}
  .qr-result{flex:1;min-height:80px;border:1px solid var(--border-color);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:var(--text-primary);background:var(--card-bg);resize:vertical;white-space:pre-wrap;}
  .qr-empty{align-self:stretch;text-align:center;color:var(--text-muted);font-size:11px;padding:14px 0;}

  .edit-toolbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--border-color);font-size:11px;color:var(--text-muted);flex-wrap:wrap;}
  .edit-toolbar .spacer{flex:1;}
  .tool-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
  .tool-btn:hover{border-color:var(--accent);color:var(--accent);}
  .tool-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
</style>
</head>
<body>

  <!-- ============ 生成（编码） ============ -->
  <div class="dialog-backdrop">
    <div class="dialog-box w420">
      <div class="dialog-header">
        <h2 class="dialog-title">📱 二维码工作台</h2>
        <button class="dialog-close">✕</button>
      </div>
      <div class="code-meta-bar">
        <span class="spacer"></span>
        <div class="md-mode-toggle">
          <button class="active">生成</button>
          <button>识图</button>
        </div>
      </div>
      <div class="qr-body">
        <textarea class="qr-text" spellcheck="false">https://github.com/lzul/pastepanda</textarea>
        <div class="qr-canvas-wrap">
          <canvas width="240" height="240"></canvas>
        </div>
        <span class="qr-badge">🔗 URL</span>
        <div class="qr-note">二维码全程本地生成（qrcode 库），不上云。</div>
      </div>
      <div class="edit-toolbar">
        <span class="spacer"></span>
        <button class="tool-btn">📋 复制文本</button>
        <button class="tool-btn">🖼 复制图片</button>
        <button class="tool-btn primary">💾 保存 PNG</button>
      </div>
    </div>
  </div>

  <!-- ============ 识图（解码） ============ -->
  <div class="dialog-backdrop">
    <div class="dialog-box w420">
      <div class="dialog-header">
        <h2 class="dialog-title">📱 二维码工作台</h2>
        <button class="dialog-close">✕</button>
      </div>
      <div class="code-meta-bar">
        <span class="spacer"></span>
        <div class="md-mode-toggle">
          <button>生成</button>
          <button class="active">识图</button>
        </div>
      </div>
      <div class="qr-body">
        <div class="qr-drop">📂 点击选择图片 / 拖拽到此处 / 直接粘贴（Ctrl+V）<br/>支持 PNG · JPG · WEBP · BMP</div>
        <textarea class="qr-result" spellcheck="false" placeholder="识别出的内容将显示在这里…">WIFI:T:WPA;S:MyHome;P:pass1234;;</textarea>
        <div class="qr-note">识图全程本地（jsqr），不上云、不解码外传。</div>
      </div>
      <div class="edit-toolbar">
        <span class="spacer"></span>
        <button class="tool-btn primary">📋 复制到剪贴板</button>
      </div>
    </div>
  </div>

</body>
</html>
