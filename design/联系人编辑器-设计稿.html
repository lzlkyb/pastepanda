<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>联系人编辑器（email/phone）· 设计稿（对照 editorBits / LinkEditor / ImagePreviewDialog）</title>
<style>
  :root{
    --app-bg:#F7F7F8; --card-bg:#fff; --dialog-bg:#fff; --section-bg:#F0F4F8;
    --text-primary:#0F172A; --text-secondary:#495565; --text-muted:#627083;
    --border-color:#E0E4EB; --accent:#0284C7; --accent-light:#E0F2FE; --accent-strong:#0273AD;
    --hover:#E8ECF2;
    --green:#11813A; --green-bg:#DCFCE7; --green-border:#BBF7D0;
    --orange:#C54A0A; --orange-bg:#FFF7ED; --orange-border:#FED7AA;
    --red-bg:#FEF2F2; --danger:#D82525;
    --glass-popover-shadow:0 12px 36px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--app-bg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text-primary);display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center;min-height:100vh;padding:24px;}

  .dialog-backdrop{position:relative;background:rgba(0,0,0,.35);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0;}
  .dialog-box{background:var(--dialog-bg);border:1px solid var(--border-color);border-radius:16px;
    display:flex;flex-direction:column;box-shadow:var(--glass-popover-shadow);max-width:calc(100vw - 32px);}
  .dialog-box.w420{width:420px;max-height:82vh;}
  .dialog-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;flex-shrink:0;border-bottom:1px solid var(--border-color);}
  .dialog-title{font-size:15px;font-weight:600;}
  .dialog-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);font-size:16px;}
  .dialog-close:hover{background:var(--hover);}
  .dialog-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
  .dialog-footer{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;flex-shrink:0;gap:8px;border-top:1px solid var(--border-color);font-size:10px;color:var(--text-muted);}
  .dialog-footer .right{display:flex;gap:4px;align-items:center;}
  .btn-primary{margin-left:auto;padding:5px 14px;font-size:12px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;}

  .code-meta-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:8px;background:var(--section-bg);border:1px solid var(--border-color);}
  .code-meta-left{display:flex;gap:12px;align-items:center;}
  .code-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);}
  .code-meta-label{font-weight:500;}
  .code-meta-val{font-weight:700;color:var(--text-primary);}
  .code-type-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-light);color:var(--accent-strong);}

  .edit-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tool-btn{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
  .tool-btn:hover{border-color:var(--accent);color:var(--accent);}
  .tool-btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tool-btn.accent:hover{background:var(--accent-strong);color:#fff;}

  /* ===== 本稿新增：联系人专用（套用现有令牌，非新造色） ===== */
  .contact-hero{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:var(--section-bg);border:1px solid var(--border-color);}
  .contact-hero .value{font-size:19px;font-weight:700;color:var(--text-primary);word-break:break-all;letter-spacing:.2px;}
  .contact-hero .value.mono{font-family:'SF Mono',Consolas,monospace;letter-spacing:1px;}
  .valid-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
  .invalid-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--red-bg);color:var(--danger);border:1px solid #FECACA;}
  .hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .raw-edit{width:100%;min-height:120px;border:1px solid var(--border-color);border-radius:10px;background:var(--card-bg);padding:10px 12px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.7;color:var(--text-primary);resize:vertical;}
  .note{font-size:10px;color:var(--text-muted);line-height:1.5;}
</style>
</head>
<body>

  <!-- ============ 左：email 形态 ============ -->
  <div class="dialog-backdrop">
    <div class="dialog-box w420">
      <div class="dialog-header">
        <h2 class="dialog-title">📧 编辑邮箱</h2>
        <button class="dialog-close">✕</button>
      </div>
      <div class="dialog-body">
        <div class="code-meta-bar">
          <div class="code-meta-left">
            <div class="code-meta-item"><span class="code-meta-label">行</span><span class="code-meta-val">1</span></div>
            <div class="code-meta-item"><span class="code-meta-label">字符</span><span class="code-meta-val">17</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="code-type-badge">📧 邮箱</div>
            <button class="tool-btn">⤢ 全屏</button>
          </div>
        </div>

        <div class="contact-hero">
          <div class="hero-foot">
            <span class="valid-badge">● 合法邮箱</span>
            <span class="note">自动校验格式</span>
          </div>
          <div class="value">user@example.com</div>
          <div class="edit-toolbar">
            <button class="tool-btn accent">✉ 写信</button>
            <button class="tool-btn">⧉ 复制</button>
            <button class="tool-btn">🔗 复制为 mailto 链接</button>
          </div>
        </div>

        <!-- 可编辑原文（与 LinkEditor 同：改动可保存） -->
        <textarea class="raw-edit">user@example.com</textarea>
        <div class="edit-toolbar">
          <button class="tool-btn">大写</button><button class="tool-btn">小写</button>
          <button class="tool-btn">去空白</button><button class="tool-btn">撤销</button><button class="tool-btn">重做</button>
        </div>
      </div>
      <div class="dialog-footer">
        <span>Ctrl+Enter 保存 · Esc 取消</span>
        <div class="right">
          <button class="tool-btn">⧉ 复制</button>
          <button class="tool-btn">⎘ 粘贴</button>
          <button class="tool-btn">🔖 存片段</button>
          <button class="btn-primary">💾 保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 右：phone 形态 ============ -->
  <div class="dialog-backdrop">
    <div class="dialog-box w420">
      <div class="dialog-header">
        <h2 class="dialog-title">📞 编辑电话</h2>
        <button class="dialog-close">✕</button>
      </div>
      <div class="dialog-body">
        <div class="code-meta-bar">
          <div class="code-meta-left">
            <div class="code-meta-item"><span class="code-meta-label">行</span><span class="code-meta-val">1</span></div>
            <div class="code-meta-item"><span class="code-meta-label">字符</span><span class="code-meta-val">13</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="code-type-badge">📞 电话</div>
            <button class="tool-btn">⤢ 全屏</button>
          </div>
        </div>

        <div class="contact-hero">
          <div class="hero-foot">
            <span class="valid-badge">● 合法电话</span>
            <span class="note">支持 +86 / 空格 / 横线分隔</span>
          </div>
          <div class="value mono">138 1234 5678</div>
          <div class="edit-toolbar">
            <button class="tool-btn accent">📞 拨号</button>
            <button class="tool-btn">⧉ 复制</button>
            <button class="tool-btn">🔗 复制为 tel 链接</button>
          </div>
        </div>

        <textarea class="raw-edit">138 1234 5678</textarea>
        <div class="edit-toolbar">
          <button class="tool-btn">去分隔符</button><button class="tool-btn">去空白</button>
          <button class="tool-btn">撤销</button><button class="tool-btn">重做</button>
        </div>
      </div>
      <div class="dialog-footer">
        <span>Ctrl+Enter 保存 · Esc 取消</span>
        <div class="right">
          <button class="tool-btn">⧉ 复制</button>
          <button class="tool-btn">⎘ 粘贴</button>
          <button class="tool-btn">🔖 存片段</button>
          <button class="btn-primary">💾 保存</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
