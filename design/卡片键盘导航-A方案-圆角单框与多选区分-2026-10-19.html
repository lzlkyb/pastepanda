<aside class="footnote"><p><b>体验：</b>单击卡片后按 ↑ ↓，也可以长按连续移动；Ctrl / ⌘ 单击切换多选，Shift 单击选一段。Esc 先退出多选，再清除当前位置。</p><p><b>状态区分：</b>悬停只有轻微底色；当前项保留一条贴边圆角线；多选项显示勾选。移动后旧卡片立即恢复，无延迟残影。</p><p><b>预览范围：</b>保留现有主窗口、卡片尺寸与主题。搜索和类型筛选可试用；其余入口仅作外壳示意。</p></aside>

const visible=()=>data.filter(r=>(state.type==='all'||state.type==='pinned'&&r.pinned||r.type===state.type)&&r.title.toLowerCase().includes(state.query.toLowerCase()));
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,1800)}
function sync(){document.querySelectorAll('[data-id]').forEach(el=>{const id=el.dataset.id;el.dataset.current=String(id===state.current);el.dataset.checked=String(state.checked.has(id));el.tabIndex=id===state.current?0:-1;el.setAttribute('aria-selected',String(state.checked.size?state.checked.has(id):id===state.current));el.querySelector('.check').hidden=!state.checked.has(id)});const row=data.find(r=>r.id===state.current);$('review-status').innerHTML=`当前位置：<strong>${row?esc(row.title):'未选择'}</strong> · 已勾选 ${state.checked.size} 条`;$('footer-state').textContent=state.checked.size?`已选择 ${state.checked.size} 条`:'默认空间';$('footer-state').classList.toggle('batch-count',!!state.checked.size);$('clear-selection').disabled=!state.checked.size;$('clear-selection').textContent=state.checked.size?'取消多选':'示例记录';}
function render(){const rows=visible();if(!rows.some(r=>r.id===state.current))state.current=rows[0]?.id??null;state.checked=new Set([...state.checked].filter(id=>rows.some(r=>r.id===id)));$('records').innerHTML=rows.map((r,i)=>`<div class="card" role="option" data-id="${r.id}" data-kind="${r.type}" aria-label="${esc(r.title)}" aria-posinset="${i+1}" aria-setsize="${rows.length}"><div class="kind">${icon(r.kind)}<span class="check" hidden>${icon('check')}</span></div><div class="card-main"><div class="card-title">${esc(r.title)}</div><div class="card-meta"><span class="badge">${icon('stack')}${esc(r.source)}</span><span class="badge subtype">${esc(r.sub)}</span></div></div><time>${r.time}</time></div>`).join('')||'<p class="empty">当前条件没有匹配记录</p>';$('result-label').textContent=state.query?'搜索结果':'最近记录';$('result-count').textContent=`${rows.length} 条 · 时间倒序`;$('type-tabs').innerHTML=types.map(([key,label,ic])=>`<button data-type="${key}" aria-pressed="${state.type===key}">${icon(ic)}${label}<small>${data.filter(r=>key==='all'||key==='pinned'&&r.pinned||r.type===key).length}</small></button>`).join('');$('clear-search').hidden=!state.query;sync()}
function focusCurrent(){const el=document.querySelector(`[data-id="${state.current}"]`);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',behavior:'instant'})}}
function move(delta){const rows=visible();if(!rows.length)return;const index=rows.findIndex(r=>r.id===state.current);state.current=rows[Math.max(0,Math.min(rows.length-1,index+delta))].id;state.checked.clear();state.anchor=state.current;sync();focusCurrent()}
function choose(id,e){if(e.shiftKey&&state.anchor){const ids=visible().map(r=>r.id),a=ids.indexOf(state.anchor),b=ids.indexOf(id);if(a>=0)ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(x=>state.checked.add(x));else state.checked.add(id)}else if(e.ctrlKey||e.metaKey){state.checked.has(id)?state.checked.delete(id):state.checked.add(id);state.anchor=id}else{state.checked.clear();state.anchor=id}state.current=id;sync();focusCurrent()}
$('records').onclick=e=>{const row=e.target.closest('[data-id]');if(row)choose(row.dataset.id,e)};
$('records').addEventListener('focusin',e=>{const row=e.target.closest('[data-id]');if(row&&row.dataset.id!==state.current){state.current=row.dataset.id;sync()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.checked.size){state.checked.clear();sync()}else{state.current=null;sync();$('records').tabIndex=0;$('records').focus()}e.preventDefault();return}if(e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();move(e.key==='ArrowDown'?1:-1)}if(e.key===' '&&e.target.matches('[data-id]')){e.preventDefault();choose(e.target.dataset.id,{ctrlKey:true})}});
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('multi').onclick=()=>{const ids=visible().slice(0,3).map(r=>r.id);state.checked=new Set(ids);state.current=ids.at(-1)??null;sync();focusCurrent()};
$('search').oninput=e=>{state.query=e.target.value;render()};$('clear-search').onclick=()=>{state.query='';$('search').value='';render();$('search').focus()};$('type-tabs').onclick=e=>{const b=e.target.closest('[data-type]');if(b){state.type=b.dataset.type;render()}};
$('clear-selection').onclick=()=>{state.checked.clear();sync()};
for(const [id,narrow] of [['wide',false],['narrow',true]])$(id).onclick=()=>{$('app').classList.toggle('narrow',narrow);$('wide').setAttribute('aria-pressed',String(!narrow));$('narrow').setAttribute('aria-pressed',String(narrow))};
$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='midnight';document.documentElement.dataset.theme=dark?'midnight':'ocean';$('theme').textContent=dark?'切换浅色':'切换深色'};
$('reset').onclick=()=>{state.current='2';state.anchor='2';state.checked.clear();state.query='';state.type='all';$('search').value='';render();$('records').scrollTop=0};
document.querySelectorAll('[data-shell],#time-trigger,#source-trigger').forEach(el=>el.onclick=()=>notify('此处沿用现有入口 · 本稿体验卡片选择'));
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(notify.timer);$('toast').hidden=true}});
render();
</script></body></html>
