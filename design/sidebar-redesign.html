<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边栏样式改版 — 方案 C：macOS Finder 风格</title>
<style>
/* ===== 重置 & 基础变量（ocean 主题） ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --app-bg: #F4F6F9;
  --header-bg-start: #fff;
  --header-bg-end: #F4F6F9;
  --card-bg: #fff;
  --card-border: #E0E4EB;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
  --text-primary: #0F172A;
  --text-secondary: #64748B;
  --text-muted: #7888A0;
  --border-color: #E0E4EB;
  --accent: #0284C7;
  --accent-light: #E0F2FE;
  --seg-bg: #E8E8ED;
  --seg-active-bg: #fff;
  --search-bg: #fff;
  --search-border: #E0E4EB;
  --hover: #E8ECF2;
  --sidebar-bg: #F8FAFB;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #E2E6ED;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

/* ===== 窗口 ===== */
.window {
  width: 680px;
  height: 520px;
  background: var(--app-bg);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== TopBar（模拟真实结构） ===== */
.topbar {
  padding: 16px 16px 0;
  background: linear-gradient(180deg, var(--header-bg-start) 0%, var(--header-bg-end) 100%);
  flex-shrink: 0;
}
.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ☰ 侧边栏切换按钮 */
.sidebar-toggle {
  width: 34px;
  height: 34px;
  border: none;
  background: var(--accent-light);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: 16px;
  flex-shrink: 0;
  font-family: inherit;
}
.topbar-logo {
  display: flex;
  align-items: center;
  justify-content: center;
}
.topbar-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}
.topbar-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  transition: background 0.15s, transform 0.15s;
}
.icon-btn:hover { background: rgba(129,140,248,.12); transform: scale(1.08); }
.icon-btn svg { width: 18px; height: 18px; }

/* 搜索框 */
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 14px;
  border-radius: 12px;
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.search-icon { font-size: 14px; line-height: 1; flex-shrink: 0; }
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  color: var(--text-primary);
  font-family: inherit;
}
.search-input::placeholder { color: var(--text-muted); }

/* Tab 分段控件 */
.tabs-area { padding: 10px 0 0; }
.segmented {
  display: flex;
  background: var(--seg-bg);
  border-radius: 10px;
  padding: 3px;
}
.seg-item {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 36px;
  border-radius: 8px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s;
  font-family: inherit;
}
.seg-item.active {
  color: var(--text-primary);
  font-weight: 600;
  background: var(--seg-active-bg);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.seg-icon { font-size: 15px; }
.seg-count {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* 筛选行 */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 8px 0 4px;
  align-items: center;
}
.filter-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  flex: 1;
  height: 28px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: #F1F5F9;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

/* ===== 内容区 ===== */
.content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== 侧边栏（改版后 — macOS Finder 风格） ===== */
.sidebar {
  width: 200px;
  min-width: 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* 头部 */
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 14px 6px;
  flex-shrink: 0;
}
.sidebar-header-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.sidebar-header-add {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-family: inherit;
  line-height: 1;
  transition: all 0.15s;
}
.sidebar-header-add:hover {
  background: var(--hover);
  color: var(--accent);
}

/* 列表区 */
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

/* Section 标签 */
.section-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px 10px 4px;
  opacity: 0.65;
}

/* 分组项 */
.item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  color: var(--text-primary);
  transition: all 0.12s;
  text-align: left;
  width: 100%;
}
.item:hover {
  background: var(--hover);
}
.item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

/* 图标 */
.item-icon {
  font-size: 15px;
  flex-shrink: 0;
  width: 18px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* 颜色圆点（缩小到 6px） */
.item-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-blue   { background: #3B82F6; }
.dot-green  { background: #22C55E; }
.dot-orange { background: #F97316; }
.dot-purple { background: #A855F7; }

/* 名称 */
.item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}

/* 数量 */
.item-count {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  min-width: 18px;
  text-align: right;
}
.item.active .item-count {
  color: var(--accent);
}

/* 分割线 */
.sidebar-divider {
  height: 1px;
  background: var(--border-color);
  margin: 6px 10px;
}

/* 底部 */
.sidebar-footer {
  padding: 8px;
  border-top: 1px solid var(--border-color);
  flex-shrink: 0;
}
.collapse-btn {
  width: 100%;
  padding: 6px 8px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.15s;
}
.collapse-btn:hover {
  background: var(--hover);
  color: var(--text-secondary);
}
.collapse-btn svg {
  width: 14px;
  height: 14px;
  opacity: 0.6;
}

/* ===== 右侧卡片面板 ===== */
.card-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.card-list {
  padding: 10px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  flex: 1;
}

/* 卡片（模仿真实 Card 组件） */
.card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  height: 72px;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
}
.card:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  transform: translateY(-2px) scale(1.008);
}

/* 左侧彩色边线 */
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 3px 3px 0;
}
.card-text::before { background: var(--accent); }
.card-image::before { background: #FF6482; }
.card-file::before { background: #34C759; }

/* 卡片图标 */
.card-icon {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.bgBlue   { background: linear-gradient(135deg, #E8F1FB, #D6E8FA); }
.bgGreen  { background: linear-gradient(135deg, #E5F8EC, #D4F2DE); }
.bgPink   { background: linear-gradient(135deg, #FDE8EE, #FAD6DF); }

/* 卡片内容 */
.card-content {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
  word-break: break-word;
  max-height: 36px;
  white-space: normal;
}
.card-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
}
.card-time {
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ===== 主题切换 ===== */
.theme-switcher {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  max-width: 340px;
  justify-content: flex-end;
}
.theme-btn {
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid rgba(0,0,0,0.15);
  background: #fff;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  color: #333;
}
.theme-btn:hover { background: #f0f0f0; }
.theme-btn.active-theme {
  background: #0284C7;
  color: #fff;
  border-color: #0284C7;
}

/* ===== 对比标签 ===== */
.compare-label {
  position: fixed;
  top: 52px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  font-weight: 600;
  color: #0284C7;
  background: #E0F2FE;
  padding: 4px 16px;
  border-radius: 20px;
  border: 1px solid #BAE6FD;
}
</style>
</head>

<script>
// 6 套主题
const themes = {
  ocean: {

function setTheme(name) {
  const root = document.documentElement;
  const vars = themes[name];
  Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active-theme'));
  document.querySelector(`.theme-btn[onclick="setTheme('${name}')"]`)?.classList.add('active-theme');
}
