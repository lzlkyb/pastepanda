     (src/styles/theme.css, App.module.css, TopBar/Sidebar/CardList/
      SkinScene.module.css, TopBar/Sidebar/Card/SkinScene/AppIcon/

/* ============================================================
   App 布局 (App.module.css)
   ============================================================ */
.appShell { display: flex; flex-direction: column; height: 100vh; width: 100%; background: var(--app-bg); color: var(--text-primary); overflow: hidden; }
.contentArea { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.cardPanel { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }

/* ============================================================
   顶栏 (TopBar.module.css)
   ============================================================ */
.header { padding: 16px 16px 0; background: linear-gradient(180deg, var(--header-bg-start) 0%, var(--header-bg-end) 100%); flex-shrink: 0; }
.headerTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.headerTitle { display: flex; align-items: center; gap: 8px; }
.sidebarToggle { width: 28px; height: 28px; border: none; background: transparent; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 16px; transition: all 0.15s; flex-shrink: 0; font-family: inherit; }
.sidebarToggle:hover { background: rgba(129, 140, 248, 0.12); transform: scale(1.08); }
.sidebarToggleActive { color: var(--accent-strong); background: var(--accent-light); }
.headerTitleIcon { display: flex; align-items: center; justify-content: center; }
.headerTitleText { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.headerIcons { display: flex; gap: 2px; align-items: center; }
.headerDivider { width: 1px; height: 16px; background: var(--border-color); flex-shrink: 0; margin: 0 4px; }
.iconBtn { width: 28px; height: 28px; border: none; background: transparent; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: background 0.15s, transform 0.15s, color 0.15s; }
.iconBtn:hover { background: color-mix(in srgb, currentColor 13%, transparent); transform: scale(1.08); }
.iconBtnActive { background: color-mix(in srgb, currentColor 17%, transparent); }
.iconBtn:active { transform: scale(.92); }
.iconBtn[data-hue="amber"]  { color: #F59E0B; }
.iconBtn[data-hue="sky"]    { color: #0EA5E9; }
.iconBtn[data-hue="violet"] { color: #8B5CF6; }
.iconSvg { width: 16px; height: 16px; }

.vbadge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--version-badge-gradient); color: #fff; font-size: 11px; font-weight: 600; box-shadow: 0 1px 6px var(--version-badge-shadow); cursor: pointer; font-variant-numeric: tabular-nums; }

.headerControls { padding: 0 0 4px; }
.searchFilterRow { display: flex; align-items: center; gap: 6px; }
.searchBox { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 12px; background: var(--search-bg); border: 1px solid var(--search-border); box-shadow: 0 1px 4px rgba(0,0,0,0.03); transition: all 0.2s; flex: 1; min-width: 0; }
.searchBox.focused, .searchBox.hasHistory { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-shadow), 0 2px 8px var(--accent-shadow); background: var(--card-bg); }
.searchIcon { font-size: 14px; line-height: 1; flex-shrink: 0; }
.searchInput { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; color: var(--text-primary); font-family: inherit; min-width: 0; }
.searchInput::placeholder { color: var(--text-muted); }
.searchClear { border: none; background: transparent; cursor: pointer; color: var(--text-muted); border-radius: 6px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.searchClear:hover { background: var(--hover); }

.filterDropdown { position: relative; flex: none; width: auto; min-width: 0; }
.filterDropdownBtn { display: flex; align-items: center; justify-content: space-between; gap: 4px; width: auto; max-width: 130px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-secondary); font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filterDropdownBtn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: inline-flex; align-items: center; gap: 4px; }
.filterDropdownBtn:hover { border-color: var(--accent); color: var(--accent); }
.filterDropdownMenu { position: absolute; top: calc(100% + 4px); left: auto; right: 0; min-width: 130px; background: var(--glass-popover-bg); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--glass-popover-border); border-radius: 10px; box-shadow: var(--glass-popover-shadow); z-index: 30; overflow: hidden; }
.filterDropdownItem { display: block; width: 100%; padding: 7px 12px; border: none; background: transparent; color: var(--text-primary); font-size: 11px; cursor: pointer; text-align: left; font-family: inherit; transition: background 0.1s; }
.filterDropdownItem:hover { background: var(--accent-light); }
.filterDropdownItemActive { color: var(--accent-strong); font-weight: 600; background: var(--accent-light); }

.tabsArea { padding: 10px 0 0; background: transparent; }
.segmented { display: flex; background: color-mix(in srgb, var(--seg-active-bg) 32%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid color-mix(in srgb, var(--seg-active-bg) 55%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--seg-active-bg) 50%, transparent), 0 2px 8px rgba(0,0,0,0.06); border-radius: 10px; padding: 3px; position: relative; }
.segItem { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; z-index: 1; position: relative; font-family: inherit; }
.segItemActive { color: var(--text-primary); font-weight: 600; background: transparent; }
.segItem:hover:not(.segItemActive) { color: var(--text-primary); }
.segActiveIndicator { position: absolute; inset: 0; border-radius: 8px; background: color-mix(in srgb, var(--seg-active-bg) 88%, transparent); box-shadow: 0 2px 8px rgba(0,0,0,0.12), 0 0.5px 1px rgba(0,0,0,0.05); z-index: 0; }
.segIcon { font-size: 15px; position: relative; z-index: 1; }
.segCount { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-left: 1px; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.segItemActive .segCount { color: var(--accent); }
#app[data-theme="blossom"] .segActiveIndicator { background: linear-gradient(135deg, #FFFFFF 0%, #FFDDEC 100%); box-shadow: 0 2px 8px rgba(206, 59, 112, 0.18), 0 0.5px 1px rgba(206, 59, 112, 0.08); }

.tagFilterBar { display: flex; align-items: center; gap: 6px; padding: 8px 0 2px; flex-wrap: wrap; min-height: 28px; }
.tagChip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px 0 8px; border-radius: 6px; background: var(--accent-light); color: var(--accent-strong); font-size: 11px; font-weight: 500; border: 1px solid var(--accent-border); }
.tagChipX { border: none; background: transparent; color: var(--accent-strong); cursor: pointer; font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 4px; }
.tagFilterClear { height: 22px; padding: 0 8px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 500; font-family: inherit; cursor: pointer; }
.tagFilterClear:hover { color: var(--danger); background: var(--red-bg); }
.tagFilterAdd { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 10px; border-radius: 6px; border: 1px dashed var(--border-color); background: transparent; color: var(--text-muted); font-size: 11px; font-family: inherit; cursor: pointer; }
.tagFilterAdd:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-light); }

/* ============================================================
   侧边栏 (Sidebar.module.css)
   ============================================================ */
.sidebar { width: 180px; min-width: 180px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; transition: width 0.35s cubic-bezier(0.4,0,0.2,1), min-width 0.35s cubic-bezier(0.4,0,0.2,1), border-color 0.35s ease; }
.list { flex: 1; overflow-y: auto; padding: 12px 8px 8px; display: flex; flex-direction: column; gap: 1px; scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }
.list::-webkit-scrollbar { width: 4px; }
.list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.sectionLabel { font-size: 11px; font-weight: 700; color: var(--sidebar-section-label); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 10px 6px; flex-shrink: 0; }
.item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; border: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text-primary); transition: all 0.15s; text-align: left; width: 100%; position: relative; }
.item:hover { background: var(--hover); transform: translateX(2px); }
.item.active { background: var(--accent-light); color: var(--accent-strong); font-weight: 600; }
.item.active::before { content: ''; position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 6px var(--accent-shadow); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.icon { font-size: 15px; flex-shrink: 0; width: 16px; text-align: center; line-height: 1; }
.sourceIcon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; object-fit: contain; }
.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-size: 10px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; background: var(--section-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1px 7px; line-height: 1.4; }
.item.active .count { color: var(--accent-strong); background: var(--accent-light); border-color: transparent; }
.moreBtn { display: none; width: 20px; height: 20px; border-radius: 4px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
.item:hover .moreBtn { display: flex; }
.addGroupBtn { color: var(--text-muted); font-weight: 500; opacity: 0.7; margin-top: 2px; }
.addGroupBtn:hover { opacity: 1; color: var(--accent-strong); background: var(--accent-light); }
.addIcon { font-size: 16px; font-weight: 600; flex-shrink: 0; width: 8px; text-align: center; line-height: 1; margin-right: 2px; }
.sep { height: 1px; background: var(--border-color); margin: 8px 10px 4px; }
.footer { padding: 8px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
.melodyFoot { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; }
.melodyFootImg { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(240, 86, 140, 0.28)); animation: melodyFootFloat 3.2s ease-in-out infinite; }
@keyframes melodyFootFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.melodyFootText { font-size: 11px; font-weight: 600; color: var(--accent-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collapseBtn { width: 100%; padding: 7px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
.collapseBtn:hover { background: var(--hover); color: var(--text-secondary); }
.collapseIcon { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }
.collapseBtn:hover .collapseIcon { opacity: 1; }
#app:not([data-theme="blossom"]) .melodyFoot { display: none; }

/* ============================================================
   卡片列表 (CardList.module.css)
   ============================================================ */
.scrollArea { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative; isolation: isolate; padding: 0; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--border-color) transparent;
  background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--accent-shadow) 0%, transparent 60%), radial-gradient(ellipse 80% 40% at 20% 100%, var(--glass-card-hover-glow) 0%, transparent 50%); }
.cardList { --card-height: 72px; --card-gap: 10px; padding: 10px 16px 80px; display: flex; flex-direction: column; gap: var(--card-gap); }
.cardWrap { position: relative; overflow: visible; width: 100%; z-index: 1; padding-bottom: var(--card-gap); }
.card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; cursor: pointer; position: relative; height: var(--card-height, 72px); width: 100%; box-sizing: border-box; overflow: hidden;
  background: var(--glass-card-bg); backdrop-filter: blur(var(--glass-card-blur, 12px)); -webkit-backdrop-filter: blur(var(--glass-card-blur, 12px)); border: 1px solid var(--glass-card-border); box-shadow: var(--glass-card-shadow); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.card::before { content: ''; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(180deg, var(--glass-shimmer-static) 0%, transparent 50%); z-index: 0; pointer-events: none; }
.card::after { content: ''; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(120deg, transparent 20%, var(--glass-shimmer) 35%, var(--glass-shimmer) 40%, var(--glass-shimmer) 45%, transparent 60%); background-size: 200% 100%; opacity: 0; transition: opacity 0.4s ease; z-index: 0; pointer-events: none; }
.card:hover::after { opacity: 1; animation: shimmer-sweep 1.6s ease-in-out infinite; }
@keyframes shimmer-sweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.card:hover { border-color: var(--glass-card-hover-border); box-shadow: var(--glass-card-hover-shadow); }
.card.selected { background: var(--card-selected-bg); border-color: var(--card-selected-border); box-shadow: var(--card-selected-shadow), 0 4px 16px var(--accent-shadow); }
.cardIcon { width: 42px; height: 42px; min-width: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative; z-index: 1; transition: all 0.3s ease; background: var(--glass-icon-bg); border: 1px solid var(--glass-icon-border); box-shadow: var(--glass-icon-shadow); }
.bgBlue   { background: rgba(59, 130, 246, 0.12);  border-color: rgba(59, 130, 246, 0.22);  box-shadow: inset 0 2px 4px rgba(59, 130, 246, 0.1), 0 2px 8px rgba(0,0,0,0.15); }
.bgGreen  { background: rgba(16, 185, 129, 0.12);  border-color: rgba(16, 185, 129, 0.22);  box-shadow: inset 0 2px 4px rgba(16, 185, 129, 0.1), 0 2px 8px rgba(0,0,0,0.15); }
.bgPink   { background: rgba(236, 72, 153, 0.12);  border-color: rgba(236, 72, 153, 0.22);  box-shadow: inset 0 2px 4px rgba(236, 72, 153, 0.1), 0 2px 8px rgba(0,0,0,0.15); }
.bgPurple { background: rgba(139, 92, 246, 0.12);  border-color: rgba(139, 92, 246, 0.22);  box-shadow: inset 0 2px 4px rgba(139, 92, 246, 0.1), 0 2px 8px rgba(0,0,0,0.15); }
#app[data-theme="blossom"] .bgBlue, #app[data-theme="blossom"] .bgPurple { background: linear-gradient(135deg, rgba(240, 86, 140, 0.14), rgba(206, 59, 112, 0.10)); border-color: rgba(240, 86, 140, 0.26); box-shadow: inset 0 2px 4px rgba(240, 86, 140, 0.10), 0 2px 8px rgba(206, 59, 112, 0.12); }
#app[data-theme="blossom"] .bgGreen, #app[data-theme="blossom"] .bgPink { background: linear-gradient(135deg, rgba(126, 200, 227, 0.18), rgba(91, 184, 220, 0.12)); border-color: rgba(126, 200, 227, 0.32); box-shadow: inset 0 2px 4px rgba(126, 200, 227, 0.12), 0 2px 8px rgba(91, 184, 220, 0.12); }
.colorIcon { background: var(--swatch-bg); border-color: var(--swatch-border); box-shadow: inset 0 2px 4px var(--swatch-inset), 0 2px 8px rgba(0,0,0,0.15); }
.colorDot { width: 22px; height: 22px; border-radius: 50%; background: var(--swatch-color); box-shadow: 0 0 0 2px rgba(255,255,255,0.55), inset 0 0 0 1px rgba(0,0,0,0.08); }
.cardImgThumb { width: 42px; height: 42px; min-width: 42px; min-height: 42px; padding: 0; overflow: hidden; }
.cardImgThumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.cardContent { flex: 1; min-width: 0; overflow: hidden; }
.cardTitle { font-size: 13px; font-weight: 600; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; word-break: break-word; max-height: 36px; white-space: normal; margin: 0; }
.cardSub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.cardPin { display: inline-flex; align-items: center; gap: 2px; height: 16px; padding: 0 6px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--accent-light); color: var(--accent-strong); }
.cardSource { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; display: inline-flex; align-items: center; gap: 3px; }
.cardTime { font-size: 11px; color: var(--text-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.cardPasting { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--accent-strong); background: var(--accent-light); padding: 1px 6px; border-radius: 4px; }
.tagMini { display: inline-flex; align-items: center; gap: 2px; height: 16px; padding: 0 6px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--section-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }

/* 悬停玻璃弹层 (CardHoverPopover) */
.cardPopover { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 320px; max-width: calc(100vw - 48px); padding: 12px; border-radius: 12px; z-index: 100; pointer-events: auto; animation: popoverFadeIn 0.18s ease; background: var(--glass-popover-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-popover-border); box-shadow: var(--glass-popover-shadow); }
@keyframes popoverFadeIn { from { opacity: 0; transform: translateX(-50%) translateY(4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.cardPopover::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid var(--glass-popover-bg); filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
.cardPopoverText { font-size: 12px; color: var(--text-primary); line-height: 1.65; max-height: 140px; overflow-y: auto; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; white-space: pre-wrap; word-break: break-word; user-select: text; margin-bottom: 10px; padding-right: 2px; }
.cardPopoverCode { font-size: 11px; font-family: "Fira Code", "SF Mono", "Consolas", monospace; padding: 8px 10px; border-radius: 8px; background: #1e1e2e; color: #cdd6f4; max-height: 140px; overflow: hidden; white-space: pre; text-overflow: ellipsis; line-height: 1.5; margin-bottom: 10px; }
.cardPopoverLinkHost { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; word-break: break-all; }
.cardPopoverLinkPath { font-size: 11px; color: var(--text-muted); word-break: break-all; }
.cardPopoverActions { display: flex; gap: 4px; border-top: 1px solid var(--border-color); padding-top: 8px; }
.cardPopoverBtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 5px 6px; border-radius: 7px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: 11px; font-weight: 500; color: var(--text-primary); transition: all 0.15s ease; white-space: nowrap; user-select: none; font-family: inherit; }
.cardPopoverBtn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent-strong); }
.cardPopoverBtn:active { transform: scale(0.95); }

/* ============================================================
   皮肤场景粒子 (SkinScene.module.css)
   ============================================================ */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
/* 美乐蒂 */
.melodyHeart { position: absolute; top: -30px; animation: melodyHeartFall linear infinite; filter: drop-shadow(0 0 6px rgba(255, 140, 190, 0.5)); }
@keyframes melodyHeartFall { 0% { transform: translate(0, -40px) rotate(-10deg); } 50% { transform: translate(-30px, 55vh) rotate(12deg); } 100% { transform: translate(12px, 112vh) rotate(-8deg); } }
.melodyBow { position: absolute; opacity: 0.85; animation: melodyBowFloat 7s ease-in-out infinite; }
@keyframes melodyBowFloat { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
.melodySpark { position: absolute; animation: melodySparkTw 2.8s ease-in-out infinite; }
@keyframes melodySparkTw { 0%,100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 0.95; transform: scale(1); } }
.melodyChar { position: absolute; right: 26px; bottom: 60px; width: 104px; height: 104px; object-fit: contain; animation: melodyBob 5.5s ease-in-out infinite; filter: drop-shadow(0 6px 12px rgba(200, 60, 120, 0.28)); }
@keyframes melodyBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
.haze { position: absolute; left: -10%; right: -10%; height: 180px; border-radius: 50%; background: rgba(255, 235, 245, 0.5); filter: blur(40px); }
/* 深海 */
.ray { position: absolute; top: -80px; width: 170px; height: 62vh; background: linear-gradient(180deg, rgba(150, 225, 255, 0.34), rgba(150, 225, 255, 0)); transform: skewX(-14deg); filter: blur(16px); animation: raySway 10s ease-in-out infinite; }
@keyframes raySway { 0%,100% { opacity: 0.4; transform: skewX(-14deg); } 50% { opacity: 0.8; transform: skewX(-9deg); } }
.bubble { position: absolute; border-radius: 50%; border: 1px solid rgba(170, 230, 255, 0.6); background: rgba(170, 230, 255, 0.12); animation: bubbleRise linear infinite; }
@keyframes bubbleRise { from { transform: translateY(0); } to { transform: translateY(-110vh); } }
.plankton { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #7ff3ff; box-shadow: 0 0 11px #22d3ee; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
.jelly { position: absolute; animation: jellyDrift 14s ease-in-out infinite; }
@keyframes jellyDrift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-36px); } }
/* 晨曦 */
.dawnSun { position: absolute; right: 70px; top: 46px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fffdf5 0%, #ffe3ae 40%, rgba(255,196,130,0) 72%); filter: blur(2px); animation: dawnSunPulse 9s ease-in-out infinite; }
@keyframes dawnSunPulse { 0%,100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
.dawnRay { position: absolute; top: -60px; width: 150px; height: 58vh; background: linear-gradient(180deg, rgba(255, 214, 150, 0.32), rgba(255, 214, 150, 0)); transform: skewX(-12deg); filter: blur(14px); animation: dawnRaySway 12s ease-in-out infinite; }
@keyframes dawnRaySway { 0%,100% { opacity: 0.35; transform: skewX(-12deg); } 50% { opacity: 0.7; transform: skewX(-7deg); } }
.dawnCloud { position: absolute; height: 24px; border-radius: 999px; background: linear-gradient(90deg, rgba(255,255,255,0.75), rgba(255,224,196,0.45)); filter: blur(5px); animation: dawnCloudDrift linear infinite; }
@keyframes dawnCloudDrift { from { transform: translateX(0); } to { transform: translateX(-280px); } }
/* 海洋 */
.sun { position: absolute; width: 150px; height: 150px; border-radius: 50%; right: 90px; top: 50px; background: radial-gradient(circle, #fffbe8 0%, #ffeaa6 42%, rgba(255,234,166,0) 72%); filter: blur(2px); }
.glint { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; animation: glintTw 2.6s ease-in-out infinite; }
@keyframes glintTw { 0%,100% { opacity: 0.15; } 50% { opacity: 0.95; } }
.gull { position: absolute; color: #3a6d8f; opacity: 0.75; animation: gullGlide 14s linear infinite; }
@keyframes gullGlide { from { transform: translateX(0); } to { transform: translateX(-120vw); } }
.boat { position: absolute; left: 16%; bottom: 150px; font-size: 34px; animation: boatBob 4s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgba(9,60,100,0.3)); }
@keyframes boatBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
.waves { position: absolute; inset: 0; width: 100%; height: 100%; }
/* 午夜 */
.aurora { position: absolute; left: -10%; right: -10%; top: -40px; height: 220px; background: linear-gradient(100deg, rgba(139,124,246,0), rgba(139,124,246,0.16), rgba(56,189,248,0.14), rgba(139,124,246,0)); filter: blur(30px); animation: auroraSway 11s ease-in-out infinite; }
@keyframes auroraSway { 0%,100% { transform: translateX(-30px) skewX(-8deg); opacity: 0.6; } 50% { transform: translateX(30px) skewX(6deg); opacity: 1; } }
.star { position: absolute; border-radius: 50%; background: #cdd3ff; animation: starTw 4s ease-in-out infinite; }
@keyframes starTw { 0%,100% { opacity: 0.15; } 50% { opacity: 0.95; } }
.shoot { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; animation: shootFly 6s linear infinite; }
.shoot::after { content: ''; position: absolute; left: 0; top: 0; width: 70px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent); transform: rotate(-32deg) translateX(-60px); }
@keyframes shootFly { 0% { transform: translate(0,0); opacity: 0; } 4% { opacity: 1; } 12% { transform: translate(-320px, 200px); opacity: 0; } 100% { transform: translate(-320px, 200px); opacity: 0; } }
.moon { position: absolute; right: 100px; top: 64px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 34% 34%, #f4f1ff 0%, #cfc7f5 55%, #a89cf0 100%); box-shadow: 0 0 50px rgba(139,124,246,0.5), inset -15px -11px 0 rgba(90,74,180,0.35); }
.mountains { position: absolute; inset: 0; width: 100%; height: 100%; }
/* 森林 */
.canopy { position: absolute; inset: 0; width: 100%; height: 100%; }
.mist { position: absolute; left: -10%; right: -10%; height: 130px; border-radius: 50%; background: rgba(255, 253, 245, 0.8); filter: blur(32px); animation: mistMove 16s ease-in-out infinite; }
@keyframes mistMove { 0%,100% { transform: translateX(-40px); } 50% { transform: translateX(40px); } }
.leaf { position: absolute; width: 10px; height: 7px; border-radius: 60% 40% 60% 40%; background: #8fae7e; opacity: 0.85; animation: leafFall linear infinite; }
@keyframes leafFall { 0% { transform: translateY(-30px) rotate(0); } 100% { transform: translateY(110vh) rotate(480deg); } }
.fly { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #d9e8a0; box-shadow: 0 0 8px #b8d468; animation: flyFloat 7s ease-in-out infinite; }
@keyframes flyFloat { 0%,100% { transform: translate(0,0); opacity: 0.3; } 25% { opacity: 1; } 50% { transform: translate(24px,-30px); opacity: 0.8; } 75% { opacity: 1; } }

/* 预览工具条（设计稿专用，非应用内 UI） */

/* ============================================================
   美乐蒂常驻角落 + 多状态互动（设计稿增强层 · 真实 melody.png 为角色）

.melodyMascot { position: fixed; right: 16px; bottom: 14px; z-index: 60; width: 138px; height: 156px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: opacity .4s ease, transform .35s cubic-bezier(.2,.9,.3,1.2); }

/* 3D 角色（美乐蒂风格原创，R3F 驱动）的姿态由底部 R3F module 的 useFrame 驱动；本层仅保留 DOM 覆盖（气泡/情绪/粒子） */

<!-- 常驻 3D 角色「团团」：R3F + htm（esm.sh 动态加载，离线自动回退 melody.png）。真实代码将用 @react-three/fiber + drei。 -->
<script type="module">
(async () => {
  const container = document.getElementById('mascotRoot');
  const fallback  = document.getElementById('melodyBody');
  let ok = true, React, createRoot, Canvas, htm, html;
  try {
    const R  = await import('https://esm.sh/react@18.3.1');
    React = R.default || R;
    const RD = await import('https://esm.sh/react-dom@18.3.1/client');
    createRoot = RD.createRoot;
    const F  = await import('https://esm.sh/@react-three/fiber@8.17.10?deps=react@18.3.1,react-dom@18.3.1,three@0.160.0');
    Canvas = F.Canvas;
    const H  = await import('https://esm.sh/htm@3.1.1');
    htm = H.default;
    html = htm.bind(React.createElement);
  } catch (e) { ok = false; }
  if (!ok || !Canvas) {
    if (fallback) fallback.style.display = 'block';
    window.Mascot3D = { setPose(){}, setVisible(v){ if(fallback) fallback.style.display = v ? 'block' : 'none'; }, _fallback:true };
    return;
  }

  const { useRef, useEffect } = React;
  const TR = { greet:0.85, copy:0.6, collect:0.7, paste:1.0, edit:1.2, delete:0.55, error:0.55, cheer:0.95, pet:0.7, theme:0.8 };

  function Tuan(){
    const root = useRef(), head = useRef(), armL = useRef(), armR = useRef(), eyeL = useRef(), eyeR = useRef();
    const pose = useRef('idle'), pt = useRef(0), clk = useRef(0);
    const mouse = useRef({x:0,y:0}), look = useRef({x:0,y:0}), hidden = useRef(false);
    useEffect(()=>{ window.Mascot3D.setPose = (p)=>{ pose.current = p; pt.current = 0; }; }, []);
    useEffect(()=>{ window.Mascot3D.setVisible = (v)=>{ hidden.current = !v; if(fallback) fallback.style.display = v ? 'none' : 'block'; }; }, []);
    useEffect(()=>{
      const onMove = (e)=>{ mouse.current.x = (e.clientX/window.innerWidth)*2-1; mouse.current.y = (e.clientY/window.innerHeight)*2-1; };
      window.addEventListener('mousemove', onMove);
      return ()=> window.removeEventListener('mousemove', onMove);
    }, []);
    const easeOutBack = (x)=>{ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
    F.useFrame((state, dt)=>{
      clk.current += dt;
      if (hidden.current) return;
      const t = clk.current;
      pt.current += dt;
      const cur = pose.current;
      if (TR[cur] && pt.current > TR[cur] && cur!=='idle' && cur!=='sleep') pose.current = 'idle';
      let rootY = Math.sin(t*1.7)*0.06, headPitch = Math.sin(t*1.3)*0.05, rootYaw=0, rootRoll=0, scale=1, aLz=0,aLx=0,aRz=0,aRx=0, eyeY=1;
      const prog = TR[cur] ? Math.min(pt.current/TR[cur],1) : 1;
      switch(cur){
        case 'greet':  scale=easeOutBack(Math.min(pt.current/0.5,1)); rootYaw=(pt.current/0.85)*Math.PI*2; rootY+=Math.sin(Math.min(pt.current/0.5,1)*Math.PI)*0.22; break;
        case 'copy':   rootY+=Math.sin(prog*Math.PI)*0.45; scale=1+Math.sin(prog*Math.PI)*0.06; break;
        case 'collect':
        case 'pet':    aLz=-1.0; aLx=-0.3; aRz=1.0; aRx=-0.3; scale=1.05; rootY+=Math.sin(prog*Math.PI)*0.12; break;
        case 'paste':
        case 'wave':   aLz=1.0; aLx=-0.45+Math.sin(pt.current*12)*0.35; break;
        case 'edit':   headPitch+=0.18+Math.sin(pt.current*2)*0.18; rootRoll+=Math.sin(pt.current*2)*0.03; aRx=-0.8; aRz=0.4; break;

  } else if(theme==='ocean-dark'){
    h += '<div class="ray" style="left:18%"></div><div class="ray" style="left:46%;animation-delay:-4s"></div><div class="ray" style="left:72%;animation-delay:-7s"></div>';
    h += '<svg class="jelly" style="right:8%;top:12%" width="120" height="150" viewBox="0 0 120 150"><defs><radialGradient id="j" cx="50%" cy="30%"><stop offset="0%" stop-color="rgba(150,238,255,0.9)"/><stop offset="100%" stop-color="rgba(80,160,255,0.04)"/></radialGradient></defs><ellipse cx="60" cy="42" rx="46" ry="36" fill="url(#j)"/><path d="M30,66 q-6,36 -13,54 M48,74 q-2,40 -7,60 M62,76 q2,42 5,62 M78,72 q8,36 15,52 M92,60 q11,30 19,44" stroke="rgba(140,225,255,0.45)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
    for(let i=0;i<12;i++){ const left=rnd(100),size=9+rnd(22),dur=8+rnd(9),delay=-rnd(14),bottom=-20-rnd(120);
      h += `<span class="bubble" style="left:${left}%;bottom:${bottom}px;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`; }
    for(let i=0;i<20;i++){ const left=rnd(100),top=rnd(100),delay=-rnd(3); h += `<span class="plankton" style="left:${left}%;top:${top}%;animation-delay:${delay}s"></span>`; }
  } else if(theme==='ocean'){
    h += '<div class="sun"></div><span class="gull" style="top:14%;left:100%;font-size:20px">⌄</span><span class="gull" style="top:9%;left:110%;font-size:14px;animation-delay:-5s">⌄</span><div class="boat">⛵</div>';
    h += '<svg class="waves" viewBox="0 0 1200 560" preserveAspectRatio="none"><path d="M0,380 C200,350 400,420 600,390 C800,360 1000,420 1200,390 L1200,560 L0,560 Z" fill="rgba(9,60,110,0.14)"/><path d="M0,430 C220,400 420,470 640,435 C860,400 1040,470 1200,435 L1200,560 L0,560 Z" fill="rgba(9,60,110,0.22)"/><path d="M0,480 C240,450 460,515 680,480 C900,450 1060,515 1200,480 L1200,560 L0,560 Z" fill="rgba(6,42,80,0.34)"/><path d="M0,525 C260,500 480,550 700,522 C920,500 1080,550 1200,525 L1200,560 L0,560 Z" fill="rgba(5,34,66,0.5)"/></svg>';
    for(let i=0;i<26;i++){ const left=rnd(100),top=55+rnd(38),delay=-rnd(3); h += `<span class="glint" style="left:${left}%;top:${top}%;animation-delay:${delay}s"></span>`; }
  } else if(theme==='midnight'){
    h += '<div class="aurora"></div>';
    for(let i=0;i<80;i++){ const left=rnd(100),top=rnd(68),size=Math.random()<0.85?2:3,delay=-rnd(4),op=0.3+rnd(0.7); h += `<span class="star" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;opacity:${op};animation-delay:${delay}s"></span>`; }
    h += '<span class="shoot" style="left:70%;top:8%"></span><span class="shoot" style="left:40%;top:4%;animation-delay:-3s"></span><div class="moon"></div>';
    h += '<svg class="mountains" viewBox="0 0 1200 560" preserveAspectRatio="none"><path d="M0,560 L0,470 L180,380 L340,470 L520,400 L700,490 L900,410 L1080,480 L1200,440 L1200,560 Z" fill="rgba(20,18,38,0.8)"/><path d="M0,560 L0,510 L240,460 L480,515 L720,470 L960,520 L1200,490 L1200,560 Z" fill="rgba(12,11,24,0.95)"/></svg>';
  } else if(theme==='forest'){
    h += '<svg class="canopy" viewBox="0 0 1200 560" preserveAspectRatio="none"><g fill="#8fa383" opacity="0.4"><ellipse cx="300" cy="110" rx="95" ry="48"/><ellipse cx="385" cy="80" rx="72" ry="37"/><ellipse cx="225" cy="85" rx="62" ry="31"/><ellipse cx="830" cy="140" rx="105" ry="50"/><ellipse cx="915" cy="105" rx="74" ry="37"/></g><g fill="#5f7a58" opacity="0.6"><path d="M1080,560 L1080,235 Q1080,210 1100,210 Q1120,210 1120,235 L1120,560 Z"/><path d="M1053,295 Q1012,258 1026,206 Q1077,232 1079,283 Z"/><path d="M1118,335 Q1161,299 1150,247 Q1099,271 1097,325 Z"/></g><g fill="#7a8f6f" opacity="0.5"><path d="M55,560 L55,300 Q55,280 70,280 Q85,280 85,300 L85,560 Z"/><path d="M35,330 Q5,300 15,260 Q55,280 57,320 Z"/><path d="M83,360 Q115,330 107,290 Q67,308 65,350 Z"/></g><g fill="#6b8266" opacity="0.5"><path d="M170,560 l28,-150 l28,150 Z"/><path d="M232,560 l22,-110 l22,110 Z"/><path d="M920,560 l30,-170 l30,170 Z"/></g></svg>';
    h += '<div class="mist" style="bottom:30px"></div><div class="mist" style="bottom:150px;opacity:.55;animation-delay:-8s"></div>';
    for(let i=0;i<10;i++){ const left=rnd(100),dur=8+rnd(8),delay=-rnd(10); h += `<span class="leaf" style="left:${left}%;top:-20px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`; }
    for(let i=0;i<12;i++){ const left=5+rnd(90),top=40+rnd(50),delay=-rnd(7); h += `<span class="fly" style="left:${left}%;top:${top}%;animation-delay:${delay}s"></span>`; }
  } else if(theme==='dawn'){
    h += '<div class="dawnSun"></div><div class="dawnRay" style="left:12%"></div><div class="dawnRay" style="left:38%;animation-delay:-5s"></div><div class="dawnRay" style="left:64%;animation-delay:-9s"></div>';
    for(let i=0;i<6;i++){ const left=rnd(90),top=40+rnd(220),width=150+rnd(180),op=0.5+rnd(0.4),dur=24+rnd(18),delay=-rnd(30); h += `<span class="dawnCloud" style="left:${left}%;top:${top}px;width:${width}px;opacity:${op};animation-duration:${dur}s;animation-delay:${delay}s"></span>`; }
  }
  s.innerHTML = h;
}

/* ============ 主题切换 ============ */
function switchTheme(t){
  const app = document.getElementById('app');
  app.setAttribute('data-theme', t);
  document.getElementById('appIcon').src = (t==='blossom') ? 'melody.png' : 'icon.png';
  document.querySelectorAll('.themeBtn').forEach(b=> b.classList.toggle('active', b.dataset.t===t));
  const mascot = document.getElementById('melodyMascot');
  if(t==='blossom'){ mascot.classList.remove('hidden'); Melody.state('theme', '换装啦~'); }
  else { mascot.classList.add('hidden'); }
  renderScene(t);
  renderCards();
}
document.querySelectorAll('.themeBtn').forEach(b=> b.addEventListener('click', ()=> switchTheme(b.dataset.t)));

/* ============ 常驻角落 3D 角色（美乐蒂风格原创，R3F 驱动，规避IP） ============ */
/* 旧裸 Three.js 实现已停用；3D 改由底部 R3F module 驱动。此处仅留全局桩，模块加载后注入真实实现。 */
window.Mascot3D = window.Mascot3D || { setPose(){}, setVisible(){}, _stub:true };

/* ============ 美乐蒂常驻角落 + 多状态互动 ============ */
const Melody = (() => {
  const root   = document.getElementById('melodyMascot');
  const body   = document.getElementById('melodyBody');
  const speech = document.getElementById('melodySpeech');
  const mood   = document.getElementById('melodyMood');
  const fx     = document.getElementById('melodyFx');

  const LINES = {
    greet:'嗨，我帮你收着啦 💗', copy:'帮你存好啦~ 💗', paste:'贴好咯！',
    collect:'收藏住啦 ✨', edit:'改好啦~', think:'找找看…', delete:'啊…删掉啦',
    error:'出问题了…别急', cheer:'搞定！🎉', sleep:'zzz…', idle:'', pet:'最喜欢一起整理啦 💗', wave:'在呢~'
  };
  const MOODS = {
    greet:'✨', copy:'💗', paste:'👋', collect:'💗', edit:'✏️', think:'🔍',
    delete:'😢', error:'❗', cheer:'🎉', sleep:'💤', idle:'', pet:'💗', wave:'👋'
  };
  const FX = {
    copy:['💗','💕','💖'], collect:['💗','✨','💕'], cheer:['🎉','✨','💗','⭐'],
    greet:['✨','💗'], think:['💭','🔍'], delete:['💔'], error:['⚠️'], paste:['👋'],
    edit:['✏️'], pet:['💗','💕','✨'], wave:['👋'], sleep:['💤']
  };
  const BODY = {
    greetc:'s-greet', greet:'s-greet', copy:'s-copy', collect:'s-collect', paste:'s-paste',
    edit:'s-edit', think:'s-think', delete:'s-delete', error:'s-error', cheer:'s-cheer',
    sleep:'s-sleep', theme:'s-theme', wave:'s-paste', pet:'s-collect'
  };

  let idleTimer=null, speechTimer=null, revertTimer=null;

  function spawnFx(kind){
    const arr = FX[kind]; if(!arr) return;
    arr.forEach((e,i)=>{
      const s = document.createElement('span');
      s.textContent = e;
      s.style.left = (28 + Math.random()*56) + 'px';
      s.style.top  = (36 + Math.random()*30) + 'px';
      s.style.setProperty('--fx-x', (Math.random()*44-22).toFixed(0)+'px');
      s.style.setProperty('--fx-y', (-58 - Math.random()*46).toFixed(0)+'px');
      s.style.setProperty('--fx-r', (Math.random()*60-30).toFixed(0)+'deg');
      s.style.animationDelay = (i*0.12)+'s';
      fx.appendChild(s);
      setTimeout(()=> s.remove(), 1700 + i*120);
    });
  }

  function setState(s, text){
    if(document.getElementById('app').getAttribute('data-theme')!=='blossom') return;
    window.Mascot3D.setPose((s==='idle') ? 'idle' : s);
    const m = MOODS[s] || ''; mood.textContent = m; mood.classList.toggle('show', !!m);
    const t = (text!==undefined) ? text : LINES[s];
    if(t){ speech.textContent = t; speech.classList.add('show'); } else { speech.classList.remove('show'); }
    spawnFx(s);
    clearTimeout(speechTimer); clearTimeout(revertTimer); clearTimeout(idleTimer);
    if(s!=='idle' && s!=='sleep'){
      speechTimer = setTimeout(()=> speech.classList.remove('show'), 2600);
      revertTimer = setTimeout(()=>{ body.className='melodyBody'; mood.classList.remove('show'); }, 3000);
      resetIdle();
    }
  }

  function resetIdle(){ clearTimeout(idleTimer); idleTimer = setTimeout(()=> setState('sleep'), 14000); }

  return {
    state: setState,
    wake(){ body.className='melodyBody'; mood.classList.remove('show'); speech.classList.remove('show'); clearTimeout(speechTimer); clearTimeout(revertTimer); resetIdle(); },
    pet(){ setState('pet'); },
    resetIdle
  };
})();

/* ---- 角色自身交互 ---- */
document.getElementById('melodyMascot').addEventListener('click', ()=> Melody.pet());
document.getElementById('melodyMascot').addEventListener('mouseenter', ()=>{
  if(document.getElementById('app').getAttribute('data-theme')==='blossom') Melody.state('wave');
});

/* ---- 卡片悬停弹层动作 → 角色状态（事件委托） ---- */
document.getElementById('cardList').addEventListener('click', (e)=>{
  const btn = e.target.closest('.cardPopoverBtn'); if(!btn) return;
  const txt = btn.textContent;
  if(txt.includes('收藏')) Melody.state('collect');
  else if(txt.includes('复制')) Melody.state('copy');
  else if(txt.includes('编辑')) Melody.state('edit');
  else if(txt.includes('删除')) Melody.state('delete');
  Melody.resetIdle();
});

/* ---- 搜索框 → 思考态 ---- */
const _searchInput = document.querySelector('.searchInput');
let _searchTimer = null;
_searchInput.addEventListener('input', ()=>{
  if(_searchInput.value.trim()===''){ Melody.wake(); return; }
  Melody.state('think');
  clearTimeout(_searchTimer); _searchTimer = setTimeout(()=> Melody.wake(), 1200);
});

/* ---- 演示控制器 ---- */
document.querySelectorAll('#melodyDemo button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const a = b.dataset.act;
    if(a==='idle') Melody.wake(); else Melody.state(a);
  });
});

/* ============ 初始化 ============ */
renderTabs('all');
renderCards();
renderScene('blossom');
document.querySelector('.themeBtn[data-t="blossom"]').classList.add('active');
Melody.state('greet');
Melody.resetIdle();
</script>
</body>
