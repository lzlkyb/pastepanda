<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PastePanda · 设备识别图标方案</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#182332;--muted:#526172;--line:#dde4eb;--accent:#007fb5;--tint:#e8f4fb;--icon:#344b62;--screen:#d1e8f4;--ok:#21804b;--focus:#007fb5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.55}body.dark{--bg:#151b23;--surface:#202934;--ink:#f0f4f8;--muted:#b5c2d0;--line:#3c4b5c;--accent:#7acbfa;--tint:#263d50;--icon:#d3dfeb;--screen:#46667c;--ok:#7ed5a0;--focus:#7acbfa;color-scheme:dark}main{max-width:1240px;padding:48px 32px 36px;margin:auto}h1{font-size:32px;letter-spacing:-.025em;line-height:1.3;margin:8px 0 12px}h2{font-size:21px;margin:0}p{margin:0;color:var(--muted)}.eyebrow{font-size:13px;color:var(--accent);font-weight:650}.intro{max-width:760px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:28px 0}.segmented{display:flex;padding:4px;gap:4px;background:var(--line);border-radius:12px}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:active{opacity:.72}.segmented button,.theme{padding:8px 16px;border-radius:9px;background:transparent;font-size:14px}.segmented button[aria-pressed=true]{background:var(--surface);font-weight:650}.theme{background:var(--surface)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}.scheme{min-width:0}.schemehead{display:flex;align-items:center;gap:10px;margin:0 0 8px}.recommend{font-size:12px;padding:2px 8px;color:var(--accent);background:var(--tint);border-radius:7px}.description{font-size:14px;min-height:52px}.stage{margin:20px 0;background:var(--surface);border-radius:16px;overflow:hidden}.listhead{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:650}.listhead small{font-size:12px;color:var(--muted);font-weight:400}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:96px;padding:18px 16px;background:transparent;position:relative}.row+.row{border-top:1px solid var(--line)}.row:hover{background:var(--bg)}.row[aria-pressed=true]{background:var(--tint)}.avatar{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--icon);background:var(--bg);border-radius:11px}.avatar svg{width:34px;height:34px;display:block}.copy{flex:1;min-width:0}.name{display:block;font-size:15px;font-weight:650;overflow-wrap:anywhere}.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;flex-wrap:wrap}.type{color:var(--ink);font-weight:550}.dot{display:inline-block;width:6px;height:6px;background:var(--ok);border-radius:50%;margin-right:4px}.chevron{font-size:21px;color:var(--muted);font-weight:400}.rule{font-size:13px;padding-top:4px}.rule strong{color:var(--ink)}.detail{margin-top:28px;padding:20px 24px;background:var(--surface);border-radius:14px;display:flex;align-items:center;gap:16px}.detail .avatar{width:60px;height:60px}.detail .avatar svg{width:48px;height:48px}.detail strong{display:block;font-size:17px}.detail p{font-size:13px}.foot{margin-top:24px;font-size:13px}.mini{display:flex;gap:14px;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);background:var(--bg)}.mini span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.mini svg{width:24px;height:24px;color:var(--icon)}.b .avatar{background:transparent}.c .avatar{background:var(--tint);color:var(--accent);font-size:13px;font-weight:650;border-radius:10px}.c .meta .type{font-weight:400;color:var(--muted)}body.mobile .avatar{width:48px;height:48px}body.mobile .avatar svg{width:38px;height:38px}body.mobile .row{min-height:100px}body.mobile .meta{font-size:13px}body.mobile .chevron{display:block}body.desktop .chevron{display:none}body.desktop .avatar{width:36px;height:36px}body.desktop .avatar svg{width:29px;height:29px}.notice{font-size:13px;margin-left:auto;color:var(--muted)}::selection{background:var(--tint);color:var(--ink)}@media(max-width:960px){.grid{grid-template-columns:1fr;gap:32px}.scheme{max-width:440px;width:100%;margin:auto}.description{min-height:0}.notice{margin-left:0}main{padding:28px 20px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body class="desktop"><main>
<div class="eyebrow">PastePanda / 设备识别 · 局部设计提案</div><h1>一眼看清，你连的是哪台设备。</h1><p class="intro">沿用当前设备列表、真实名称与连接状态，只优化设备识别。三套方案都保留常驻类型文字，手机和平板不再只靠两个相似的矩形区分。</p>
<div class="controls"><div class="segmented" aria-label="预览尺寸"><button data-view="desktop" aria-pressed="true">电脑端列表</button><button data-view="mobile" aria-pressed="false">手机端列表</button></div><button class="theme" id="theme" aria-pressed="false">切换深色</button><span class="notice">点击设备行，查看选中反馈与详情图标</span></div>
<div class="grid" id="grid"></div>
<div class="detail" aria-live="polite"><div class="avatar" id="detailIcon"></div><div><strong id="detailName">Google Pixel 9</strong><p id="detailType">手机 · Android</p></div></div>
<p class="foot">名称、状态和点击行为沿用现有逻辑；设备类型待确认时显示「设备 · 类型待识别」。平板需要对端确认硬件类型，不因运行 Android 就默认当成手机。示例设备用于比较图形，并非实时设备列表。</p>
</main><script>
const glyphs={
phone:'<path fill="currentColor" d="M21 5h22a5 5 0 0 1 5 5v44a5 5 0 0 1-5 5H21a5 5 0 0 1-5-5V10a5 5 0 0 1 5-5Z"/><rect x="20" y="9" width="24" height="46" rx="3" fill="var(--screen)"/><rect x="27" y="10" width="10" height="3" rx="1.5" fill="currentColor"/><rect x="27" y="50" width="10" height="2" rx="1" fill="currentColor"/>',
tablet:'<rect x="4" y="12" width="56" height="40" rx="5" fill="currentColor"/><rect x="9" y="16" width="46" height="32" rx="2" fill="var(--screen)"/><circle cx="6.5" cy="32" r="1" fill="var(--screen)"/>',
computer:'<rect x="3" y="8" width="58" height="38" rx="4" fill="currentColor"/><rect x="7" y="12" width="50" height="29" rx="1" fill="var(--screen)"/><path d="M27 46h10l3 10H24Z" fill="currentColor"/><rect x="17" y="56" width="30" height="3" rx="1.5" fill="currentColor"/>'};
const miniGlyphs={
phone:'<rect x="20" y="4" width="24" height="55" rx="6" fill="var(--icon)"/><rect x="23" y="8" width="18" height="47" rx="4" fill="var(--screen)"/><rect x="27" y="8" width="10" height="3" rx="1.5" fill="var(--icon)"/><path d="M25 35h14v15H25Z" fill="var(--accent)" opacity=".32"/>',
tablet:'<rect x="3" y="12" width="58" height="40" rx="5" fill="var(--icon)"/><rect x="6" y="15" width="52" height="34" rx="3" fill="var(--screen)"/><path d="M6 37h52v12H6Z" fill="var(--accent)" opacity=".32"/><circle cx="32" cy="13.5" r=".8" fill="var(--screen)"/>',
computer:'<rect x="2" y="7" width="60" height="40" rx="4" fill="var(--icon)"/><rect x="5" y="10" width="54" height="31" rx="2" fill="var(--screen)"/><path d="M5 28h54v13H5Z" fill="var(--accent)" opacity=".32"/><path d="M27 47h10l2 10H25Z" fill="var(--icon)"/><rect x="17" y="57" width="30" height="3" rx="1.5" fill="var(--icon)"/>'};
const devices=[{kind:'phone',type:'手机',name:'Google Pixel 9',os:'Android',status:'刚刚可连接'},{kind:'tablet',type:'平板',name:'iPad Air',os:'iPadOS',status:'局域网在线'},{kind:'computer',type:'电脑',name:'机械革命',os:'Windows 11',status:'刚刚可连接'}];
const schemes=[{key:'a',title:'A · 清晰实心轮廓',desc:'手机竖屏 + 顶部听筒；平板横屏；电脑带底座。用明显不同的轮廓建立第一眼识别。',rule:'推荐：小尺寸仍可识别，保持简洁。<br>类型放在名称下方，与连接状态分开。'},{key:'b',title:'B · 设备小插画',desc:'有屏幕、边框和面板细节，更像眼前的真实设备。三类设备仍统一使用同一套颜色。',rule:'更有苹果设备列表的感觉。<br>适合较大头像；小尺寸细节容易变弱。'},{key:'c',title:'C · 类型文字标牌',desc:'头像直接写「手机 / 平板 / 电脑」，图形退居详情。用户无需学习或猜测图标含义。',rule:'辨识最直接，也最克制。<br>图形趣味较少，列表更偏工具界面。'}];
function svg(kind,scheme='a'){return '<svg viewBox="0 0 64 64" aria-hidden="true">'+(scheme==='b'?miniGlyphs[kind]:glyphs[kind])+'</svg>'}
document.getElementById('grid').innerHTML=schemes.map(s=>`<section class="scheme ${s.key}"><div class="schemehead"><h2>${s.title}</h2>${s.key==='a'?'<span class="recommend">推荐</span>':''}</div><p class="description">${s.desc}</p><div class="stage"><div class="listhead">我的设备 <small>3 台设备</small></div>${devices.map((d,i)=>`<button class="row" data-scheme="${s.key}" data-device="${i}" aria-pressed="${i===0}"><span class="avatar">${s.key==='c'?d.type:svg(d.kind,s.key)}</span><span class="copy"><span class="name">${d.name}</span><span class="meta"><span class="type">${d.type}</span><span>· ${d.os}</span></span><span class="meta"><span><i class="dot"></i>${d.status}</span></span></span><span class="chevron" aria-hidden="true">›</span></button>`).join('')}<div class="mini">${devices.map(d=>`<span>${s.key==='c'?'':svg(d.kind,s.key)}${d.type}</span>`).join('')}</div></div><p class="rule"><strong>${s.key==='a'?'清楚、统一、低干扰':s.key==='b'?'亲切、具象、有细节':'直接、克制、不靠猜'}</strong><br>${s.rule}</p></section>`).join('');
function detail(i,s){const d=devices[i];document.getElementById('detailIcon').innerHTML=svg(d.kind,s);document.getElementById('detailName').textContent=d.name;document.getElementById('detailType').textContent=d.type+' · '+d.os}
detail(0,'a');document.querySelectorAll('.row').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-pressed',String(r.dataset.device===el.dataset.device)));detail(Number(el.dataset.device),el.dataset.scheme)}));
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{document.body.classList.remove('desktop','mobile');document.body.classList.add(el.dataset.view);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)))}));
document.getElementById('theme').addEventListener('click',e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'切换浅色':'切换深色'});
</script></body></html>
