<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6套主题版本徽章预览</title>
<style>
/* ===== 6 套主题 ===== */
[data-theme="ocean"] {
  --version-badge-gradient: linear-gradient(135deg, #0284C7, #0369A1);
  --version-badge-shadow: rgba(2, 132, 199, 0.35);
}
[data-theme="midnight"] {
  --version-badge-gradient: linear-gradient(135deg, #818CF8, #6366F1);
  --version-badge-shadow: rgba(129, 140, 248, 0.35);
}
[data-theme="forest"] {
  --version-badge-gradient: linear-gradient(135deg, #059669, #047857);
  --version-badge-shadow: rgba(5, 150, 105, 0.35);
}
[data-theme="blossom"] {
  --version-badge-gradient: linear-gradient(135deg, #EC4899, #DB2777);
  --version-badge-shadow: rgba(236, 72, 153, 0.35);
}
[data-theme="terminal"] {
  --version-badge-gradient: linear-gradient(135deg, #22C55E, #16A34A);
  --version-badge-shadow: rgba(34, 197, 94, 0.35);
}
[data-theme="sunset"] {
  --version-badge-gradient: linear-gradient(135deg, #F97316, #EA580C);
  --version-badge-shadow: rgba(249, 115, 22, 0.35);
}

/* 基础样式 */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #1a1a2e;
  color: #e8e8f0;
  padding: 32px;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.subtitle { color: #9090b0; font-size: 13px; margin-bottom: 28px; }

.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.theme-card {
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
}
.theme-card.ocean { background: linear-gradient(180deg, #E0F2FE, #F0F9FF); }
.theme-card.midnight { background: linear-gradient(180deg, #18181B, #0F0F11); }
.theme-card.forest { background: linear-gradient(180deg, #ECFDF5, #F0FDF4); }
.theme-card.blossom { background: linear-gradient(180deg, #FCE7F3, #FDF2F8); }
.theme-card.terminal { background: linear-gradient(180deg, #141414, #0A0A0A); }
.theme-card.sunset { background: linear-gradient(180deg, #281E18, #1C1410); }

.theme-card .name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.theme-card.ocean .name { color: #0F172A; }
.theme-card.midnight .name { color: #E4E4E7; }
.theme-card.forest .name { color: #0F172A; }
.theme-card.blossom .name { color: #831843; }
.theme-card.terminal .name { color: #A3A3A3; }
.theme-card.sunset .name { color: #FDBA74; }

.theme-card .accent-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 16px;
}
.theme-card.ocean .accent-tag { background: #E0F2FE; color: #0284C7; }
.theme-card.midnight .accent-tag { background: #1E1B4B; color: #A5B4FC; }
.theme-card.forest .accent-tag { background: #DCFCE7; color: #059669; }
.theme-card.blossom .accent-tag { background: #FCE7F3; color: #BE185D; }
.theme-card.terminal .accent-tag { background: #052E16; color: #86EFAC; }
.theme-card.sunset .accent-tag { background: #431407; color: #FDBA74; }

/* 统一版本徽章 */
.version-badge {
  display: inline-flex;
  align-items: center;
  font-family: "SF Mono","Fira Code","Consolas",monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 7px;
  background: var(--version-badge-gradient);
  color: #fff;
  letter-spacing: 0.3px;
  white-space: nowrap;
  box-shadow: 0 2px 8px var(--version-badge-shadow);
}
.version-badge-compact {
  font-size: 9px;
  padding: 2px 8px;
  box-shadow: 0 1px 5px var(--version-badge-shadow);
}

/* 场景行 */
.scene-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.scene-row .version-badge,
.scene-row .version-badge-compact {
  margin: 0;
}

/* 场景分隔 */
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: #9090b0;
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
</style>
</head>
<body>

<h1>6 套主题 · 版本徽章适配效果</h1>
<p class="subtitle">渐变 + 投影阴影均跟随各主题 accent 色</p>

<div class="theme-grid">
  <div class="theme-card ocean" data-theme="ocean">
    <div class="name">🌊 Ocean 海洋</div>
    <div class="accent-tag">#0284C7</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
  <div class="theme-card midnight" data-theme="midnight">
    <div class="name">🌙 Midnight 午夜</div>
    <div class="accent-tag">#818CF8</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
  <div class="theme-card forest" data-theme="forest">
    <div class="name">🌿 Forest 森林</div>
    <div class="accent-tag">#059669</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
  <div class="theme-card blossom" data-theme="blossom">
    <div class="name">🌸 Blossom 樱花</div>
    <div class="accent-tag">#EC4899</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
  <div class="theme-card terminal" data-theme="terminal">
    <div class="name">💻 Terminal 终端</div>
    <div class="accent-tag">#22C55E</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
  <div class="theme-card sunset" data-theme="sunset">
    <div class="name">🌅 Sunset 日落</div>
    <div class="accent-tag">#F97316</div>
    <span class="version-badge">v5.0.75</span>
    <div class="scene-row">
      <span class="version-badge-compact">v5.0.75</span>
    </div>
  </div>
</div>

</body>
</html>
