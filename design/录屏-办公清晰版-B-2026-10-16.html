<style>

.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}.rail{padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}.brand{font-weight:650;padding:0 8px 24px;display:flex;align-items:center;gap:8px}.brand svg{color:var(--accent)}.rail nav{display:grid;gap:8px}.rail nav button{text-align:left;background:transparent;border-color:transparent;display:flex;gap:12px;align-items:center}.rail nav button.selected{background:var(--selected);color:var(--accent)}.step{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}.rail p{font-size:12px;color:var(--muted);margin:24px 8px}.rail footer{margin:32px 8px;font-size:11px;color:var(--muted)}main{padding:24px;min-width:0;max-width:1600px;width:100%;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.heading p{margin-top:4px;color:var(--muted);font-size:12px}.demo-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.demo-tools strong{font-weight:500;color:var(--muted);margin-right:4px}.demo-tools button{font-size:12px;min-height:32px;padding:4px 12px}.scene{position:relative;isolation:isolate;height:580px;border-radius:12px;overflow:hidden;background:var(--desk);color:var(--ink);touch-action:none}.desktop-label{position:absolute;top:12px;left:16px;font-size:11px;color:var(--doc-muted)}.work-window{position:absolute;left:12%;top:10%;width:76%;height:66%;background:var(--doc);border:1px solid var(--doc-line);border-radius:8px;overflow:hidden;box-shadow:0 12px 32px rgba(22,30,45,.16);pointer-events:none}.window-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--doc-soft);font-size:12px}.work-body{display:grid;grid-template-columns:112px 1fr;height:calc(100% - 36px)}.slides{background:var(--doc-soft);padding:16px;display:grid;align-content:start;gap:12px}.slide-thumb{background:var(--doc);padding:8px;color:var(--doc-muted);border:1px solid var(--doc-line);font-size:11px}.slide-thumb:first-child{outline:2px solid var(--accent)}.sheet{padding:32px;align-self:center}.sheet .meeting{font-size:12px;color:var(--doc-muted)}.sheet h2{font-size:28px;color:var(--ink);margin:8px 0 24px;font-weight:650}.agenda{display:grid;gap:12px;font-size:13px}.agenda div{display:flex;gap:16px}.agenda b{font-variant-numeric:tabular-nums;color:var(--doc-muted);font-weight:400}.doc-bottom{margin-top:24px;font-size:11px;color:var(--doc-muted)}
.selection{position:absolute;inset:4px;outline:2px dashed var(--accent);pointer-events:none;z-index:2}.selection.window,.selection.region{inset:auto;box-shadow:0 0 0 1200px var(--scrim)}.selection.locked{outline-style:solid}.selection.recording{outline:2px solid var(--danger);box-shadow:none}.selection.paused{outline-color:var(--warning)}.selection.region:after{content:"";position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;border-radius:4px;background:var(--handle)}.scope-label{position:absolute;top:8px;left:8px;border-radius:4px;background:var(--glass);color:var(--text);padding:4px 8px;font-size:11px;max-width:calc(100% - 16px)}.toolbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--glass);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:12px 16px;z-index:5}.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar-row+.bar-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.target{font-size:13px;font-weight:600;margin-right:8px}.grow{flex:1}.toolbar .soft{font-size:12px;color:var(--muted)}.toolbar button{font-size:12px}.toolbar .primary{font-size:13px}.source-warning{font-size:12px;color:var(--warning);margin-top:8px;max-width:650px}.settings{position:absolute;bottom:calc(100% + 12px);right:0;width:340px;padding:16px;background:var(--glass);border-radius:8px;box-shadow:var(--shadow)}.settings label{display:flex;justify-content:space-between;align-items:center;gap:16px}.settings select{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px}.settings p{font-size:12px;color:var(--muted);margin-top:12px}.helper{position:absolute;top:12px;right:16px;color:var(--ink);background:var(--doc);font-size:12px;border-radius:4px;padding:4px 8px;z-index:3;max-width:70%}.countdown{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:16px;background:var(--scrim);z-index:6}.countdown>div{background:var(--glass);color:var(--text);padding:24px;border-radius:12px;text-align:center}.countdown strong{display:block;font-size:64px;line-height:1.3;font-weight:600}.countdown p{margin-bottom:16px}.rec-controls{min-width:440px;max-width:calc(100% - 32px)}.rec-state{display:flex;align-items:center;gap:8px;font-weight:600}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}.paused .status-dot{background:var(--warning)}.time{font-variant-numeric:tabular-nums;font-weight:600}.alert{padding:12px;border-radius:8px;background:var(--warning-bg);color:var(--warning);font-size:12px;margin-top:12px;max-width:660px}.alert.error{background:var(--danger-bg);color:var(--danger)}.alert button{background:transparent;color:inherit;margin-top:8px;border-color:currentColor}.result{position:absolute;right:24px;bottom:24px;width:440px;max-width:calc(100% - 48px);padding:24px;background:var(--glass);color:var(--text);box-shadow:var(--shadow);border-radius:12px;z-index:5}.result-head{display:flex;align-items:center;gap:12px}.result-head svg{width:24px;height:24px;color:var(--success)}.result .close{margin-left:auto}.file{margin:16px 0;overflow-wrap:anywhere}.file strong{font-size:13px}.file p{margin-top:4px;color:var(--muted);font-size:12px}.result-actions{display:flex;flex-wrap:wrap;gap:8px}.result-note{font-size:12px;color:var(--muted);margin-top:16px}.preview{position:absolute;inset:20px 8%;background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:5}.preview-head{display:flex;gap:8px;align-items:center}.preview-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.video-still{flex:1;min-height:90px;background:var(--doc);color:var(--ink);display:grid;place-content:center;text-align:center;position:relative;gap:12px;border-radius:4px}.video-still strong{font-size:24px}.video-still span{font-size:12px;color:var(--doc-muted)}.playback{display:flex;align-items:center;gap:12px}.playback input{flex:1;min-width:60px}.trim-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.trim-fields label{display:flex;align-items:center;gap:8px;font-size:12px}.trim-fields input{width:100%;min-width:36px}.trim-fields output{font-variant-numeric:tabular-nums}.preview .bar-row .soft{flex:1}.recent{position:absolute;inset:32px 12%;padding:24px;background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);z-index:5;overflow:auto}.recent h2{margin-bottom:16px}.record-row{display:flex;gap:12px;align-items:flex-start;background:var(--raised);padding:16px;border-radius:8px}.record-row+.record-row{margin-top:12px}.record-row svg{color:var(--accent);flex:none}.record-row .meta{min-width:0;flex:1}.record-row .meta strong{overflow-wrap:anywhere}.record-row .meta p{font-size:12px;color:var(--muted);margin:4px 0 12px}.record-row .bar-row button{font-size:12px;padding:4px 8px;min-height:32px}.empty{padding:24px 0;color:var(--muted)}.empty button{margin-top:12px}.note{margin-top:16px;padding:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:24px}.note h2{margin-bottom:8px}.note p{font-size:12px;color:var(--muted);line-height:1.9}.notice{padding:12px 16px;margin-top:12px;background:var(--selected);color:var(--accent);border-radius:8px;font-size:12px}.prototype-tag{color:var(--muted);font-size:11px;margin-top:8px}.icon-button{display:inline-flex;align-items:center;gap:8px}input[type=range]{padding:0;min-height:24px}.screen-end{position:absolute;inset:0;background:var(--desk);display:grid;place-content:center;text-align:center;gap:16px}.screen-end p{color:var(--doc-muted)}
@media(max-width:1100px){.layout{grid-template-columns:176px minmax(0,1fr)}main{padding:16px}.rail{padding:24px 8px}.scene{height:620px}.sheet{padding:24px}.sheet h2{font-size:24px}.work-body{grid-template-columns:80px 1fr}.slides{padding:8px}.toolbar{width:calc(100% - 32px)}.rec-controls{min-width:0}.preview{inset:20px 24px}.recent{inset:32px 24px}}
@media(max-width:700px){.layout{display:block}.rail{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding:0 0 8px}.rail nav{display:flex;flex-wrap:wrap;gap:4px}.rail nav button{padding:4px 8px;font-size:12px}.rail p,.rail footer{display:none}.heading{align-items:flex-start}.heading button{font-size:12px;white-space:nowrap}.scene{height:clamp(340px,calc(100dvh - 250px),640px)}.work-window{left:6%;width:88%;height:55%}.work-body{grid-template-columns:1fr}.slides{display:none}.sheet h2{font-size:20px;margin:4px 0 12px}.sheet{padding:16px}.sheet .meeting,.doc-bottom{display:none}.agenda{gap:4px;font-size:12px}.note{grid-template-columns:1fr;gap:16px}.settings{width:100%;max-width:340px}.toolbar{bottom:16px;padding:12px}.helper{top:8px;right:8px;max-width:82%}.desktop-label{display:none}.preview{inset:16px}.preview-head strong{font-size:12px}.trim-fields{grid-template-columns:1fr;gap:4px}.preview .bar-row .soft{flex-basis:100%}.result{right:16px;bottom:16px;max-width:calc(100% - 32px);padding:16px}.recent{inset:16px;padding:16px}.record-row{padding:12px}.countdown>div{max-width:90%}}

/* 录制中只占自身尺寸；覆盖通用工具条在窄屏下铺满宽度的规则。 */
.toolbar.rec-controls{width:max-content;min-width:0;max-width:calc(100% - 24px);padding:4px 6px;bottom:12px;border-radius:8px}
.rec-minirow{display:flex;align-items:center;gap:4px;white-space:nowrap}
.rec-controls button{min-height:28px;height:28px;padding:0 6px;font-size:12px;border-radius:4px;flex:none}
.rec-controls svg{width:14px;height:14px}
.rec-controls .icon-button{gap:4px}
.rec-mini-grip{width:16px;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none;color:var(--muted)}
.rec-mini-grip:active{cursor:grabbing}
.rec-mini-grip svg{width:12px;height:18px;stroke-width:3}
.rec-ministatus{display:flex;align-items:center;gap:6px;margin-right:4px}
.rec-ministatus .time{min-width:36px;font-size:12px}
.rec-ministatus .status-dot,.rec-tiny .status-dot{width:6px;height:6px;flex:none}
.rec-controls .rec-problem{color:var(--warning);background:var(--warning-bg);border-color:transparent}
.rec-more,.rec-feedback{position:absolute;bottom:calc(100% + 8px);right:0;width:224px;max-width:calc(100vw - 32px);padding:12px;background:var(--glass);box-shadow:var(--shadow);border-radius:8px;white-space:normal}
.rec-more p{font-size:12px;color:var(--muted);line-height:1.8}
.rec-menu-actions{display:grid;gap:8px;margin-top:12px}
.rec-menu-actions button{text-align:left}
.rec-feedback{width:264px;background:var(--warning-bg);color:var(--warning)}
.rec-feedback p{font-size:12px;margin-top:4px}
.rec-feedback .bar-row{margin-top:8px}
.rec-feedback button{background:transparent;color:inherit;border-color:currentColor}
.rec-feedback button.plain{border-color:transparent}
.rec-controls.near-top .rec-more,.rec-controls.near-top .rec-feedback{bottom:auto;top:calc(100% + 8px)}
.toolbar.rec-controls.is-collapsed{padding:2px}
.rec-controls .rec-tiny{display:flex;gap:6px;align-items:center;min-height:24px;height:24px;padding:0 6px;background:transparent;border:0}
.rec-tiny .has-warning{background:var(--warning)}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

<body>
<svg aria-hidden="true" hidden><defs>
<symbol id="camera" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 9 5-3v12l-5-3"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></symbol>
</defs></svg>
<div class="layout">
<aside class="rail"><div class="brand"><svg><use href="#camera"/></svg>PastePanda · 录屏</div>
<nav aria-label="设计稿场景"><button data-stage="prepare" class="selected"><span class="step">01</span>录前确认</button><button data-stage="recording"><span class="step">02</span>录制中</button><button data-stage="done"><span class="step">03</span>保存结果</button><button data-stage="preview"><span class="step">04</span>预览与裁剪</button><button data-stage="recent"><span class="step">05</span>最近录制</button></nav>
<p>点场景直接查看，也可以从「开始录制」走完一遍。</p><footer>方案 B · 待确认设计稿<br>示例画面与时长用于交互演示。</footer></aside>
<main>
<header class="heading"><div><h1>录屏，先看清再开始</h1><p>范围、声音、文件去向，都在当前这一步说清楚。</p></div><button id="theme">切换浅色</button></header>
<div class="demo-tools" id="demo-tools" aria-label="模拟状态切换"></div>
<section class="scene" id="scene" aria-label="桌面录屏交互模拟"></section>
<div class="notice" id="notice" role="status" hidden></div>
<div class="note"><section><h2 id="note-title"></h2><p id="note-copy"></p></section><section><h2>保留现有习惯</h2><p>快捷键进入、移动预览窗口、拖拽框选、3 秒倒计时、暂停、停止即保存。画质仍收在设置里；不增加必经向导，不承诺跟随窗口移动。</p></section></div>
<p class="prototype-tag">交互模拟 · 未连接屏幕、麦克风或文件系统。界面中的新增提示与行为是拟实施内容，实际成片正确性另以测试验收。</p>
</main></div>
<script>
const $=s=>document.querySelector(s), icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const state={stage:'prepare',target:'full',locked:false,region:null,sys:true,mic:false,quality:'高清',settings:false,audioError:false,actionError:false,paused:false,discard:false,controlMore:false,controlCollapsed:false,controlNotice:true,controlPos:null,count:3,saved:false,savePending:false,in:0,out:12,playing:false,recent:'ready',gif:'idle',closed:false};
let countdownTimer=null,saveTimer=null,drag=null;
const notes={prepare:['一眼看清录什么、录哪些声音','范围与音源常驻显示。移动鼠标预览窗口，单击采纳；拖拽始终画自己的区域，不被整窗吸附。窗口所在区域明确提示固定位置。声音检查失败时，就地重试或明确关闭该音源。'],recording:['录制中，只留一条小浮条','常驻只留计时、暂停、停止与更多；画质、声音详情、丢弃放进更多。左侧抓手可拖动，更多里可收起为小计时，点击恢复。正常不展开提示；异常才出现提醒，并可收起详情。实施时同步缩小原生窗口与鼠标命中范围，验证浮条不进入成片。'],done:['保存之后，文件有明确去向','结果卡显示文件名、时长、保存位置与声音异常摘要。提供预览并裁剪和打开文件夹；结果保留到主动关闭，最近录制始终可找回。隐藏主窗也能完成这一闭环。'],preview:['播放有按钮，裁剪有起止时间','明确播放/暂停；起止点可用鼠标和方向键调整，显示实际保留区间。裁剪另存新文件，保留原录像。保存时禁止重置范围，关窗只能转入后台，不把 Esc 当取消成功。'],recent:['查询失败，不能装成没有录过','最近录制保留文件名、时长和文字动作。加载、空、错误分开显示；GIF 导出提供进度、取消、失败重试和成功后的文件入口。']};
function desktop(){return `<span class="desktop-label">办公演示 · 示例桌面</span><div class="work-window"><div class="window-head"><span>每周工作同步 · 演示文稿</span><span>—　□　×</span></div><div class="work-body"><div class="slides"><div class="slide-thumb">每周工作同步</div><div class="slide-thumb">本周进展</div><div class="slide-thumb">下周安排</div></div><div class="sheet"><p class="meeting">团队周会 / 示例内容</p><h2>把进展讲清楚</h2><div class="agenda"><div><b>01</b>本周完成的工作</div><div><b>02</b>需要协作的问题</div><div><b>03</b>下周计划与安排</div></div><p class="doc-bottom">演示画面只用于说明选区，不是真实录屏内容。</p></div></div></div>`}
function targetText(){if(state.target==='full')return '整个屏幕';if(state.target==='window')return '窗口所在区域';return '自选区域'}
function sourceHint(){return state.target==='window'?'<p class="source-warning">按当前位置录制；移动或遮挡窗口会改变录到的内容。</p>':''}
function audioAlert(recording=false){return state.audioError?`<div class="alert" role="alert"><strong>${recording?'麦克风已断开，画面仍在录制':'麦克风暂时不可用'}</strong><p>${recording?'断开后的人声不会录入；停止后会在保存结果中保留提醒。':'还未开始录制。请重试，或关闭麦克风后继续。'}</p>${recording?'':`<button data-action="audio-retry">重新检查</button> <button data-action="mic-off">不录麦克风</button>`}</div>`:''}
function controls(){
 const problem=state.actionError||state.audioError;
 const position=state.controlPos?`left:${state.controlPos.x}px;top:${state.controlPos.y}px;bottom:auto;transform:none;`:'';
 const compact=state.controlCollapsed;
 return `<div class="toolbar rec-controls ${state.paused?'paused':''} ${compact?'is-collapsed':''} ${state.controlPos?.y<200?'near-top':''}" id="record-toolbar" style="${position}">
 ${compact?`<button class="rec-tiny" data-action="expand-control" aria-label="展开录屏控制条，${state.paused?'已暂停':'录制中'}，12秒" title="展开控制条"><i class="status-dot ${problem?'has-warning':''}"></i><span class="time">00:12</span><svg><path d="m9 5 7 7-7 7"/></svg></button>`:`<div class="rec-minirow">
 <span class="rec-mini-grip" data-rec-grip title="拖动控制条"><svg><path d="M8 6h0M16 6h0M8 12h0M16 12h0M8 18h0M16 18h0"/></svg></span>
 <span class="rec-ministatus" aria-label="${state.paused?'已暂停':'录制中'}"><i class="status-dot"></i><span class="time" title="${state.paused?'已暂停，计时冻结':'录制时长'}">00:12</span></span>
 <button data-action="pause" class="icon-button" title="${state.paused?'继续录制':'暂停录制'}">${icon(state.paused?'play':'pause')}${state.paused?'继续':'暂停'}</button>
 <button data-action="stop" class="primary icon-button" aria-label="停止并保存" title="停止并保存">${icon('stop')}停止</button>
 ${problem?`<button class="rec-problem" data-action="toggle-control-notice" aria-expanded="${state.controlNotice}">${state.actionError?'停止失败':'声音异常'}</button>`:''}
 <button data-action="control-more" class="plain" aria-expanded="${state.controlMore}" aria-controls="rec-more">更多</button>
 </div>`}
 ${state.controlMore&&!compact?`<div class="rec-more" id="rec-more"><p>${state.quality} · 电脑声音 ${state.sys?'开':'关'}</p><p>麦克风 ${state.audioError?'异常':state.mic?'开':'关'} · 计时不含暂停</p><div class="rec-menu-actions"><button data-action="collapse-control">收起为小计时</button><button data-action="discard" class="danger">${state.discard?'确认丢弃录像？':'丢弃录像'}</button>${state.discard?'<button data-action="keep">保留录像</button>':''}</div></div>`:''}
 ${problem&&state.controlNotice&&!state.controlMore&&!compact?`<div class="rec-feedback" role="alert"><strong>${state.actionError?'停止失败': '麦克风已断开'}</strong><p>${state.actionError?`会话尚未结束（${state.paused?'已暂停':'仍在录制'}），请重试停止。`:'画面仍在录制，断开后的人声不会录入。'}</p><div class="bar-row">${state.actionError?'<button data-action="retry-stop">重试停止</button>':''}<button class="plain" data-action="toggle-control-notice">收起提示</button></div></div>`:''}
 </div>`
}
function prepare(){return `<span class="helper">移动预览窗口 · 单击采纳 · 拖拽自选区域</span><div class="selection" id="selection"><span class="scope-label">将录制：<span id="scope-label">${targetText()}</span></span></div><div class="toolbar" id="prepbar"><div class="bar-row"><span class="target" id="target-text">将录制：${targetText()}</span><span class="grow"></span><button data-action="full" class="plain">改录整屏</button><button data-action="redraw" class="plain">重新框选</button><button data-action="quit" class="plain">退出 <kbd>Esc</kbd></button></div><div class="bar-row"><button data-action="sys" aria-pressed="${state.sys}">电脑声音 ${state.sys?'开':'关'}</button><button data-action="mic" aria-pressed="${state.mic}">麦克风 ${state.mic?'开':'关'}</button><button data-action="settings" class="plain" aria-expanded="${state.settings}">画质：${state.quality}</button><span class="grow"></span><button data-action="start" class="primary" ${state.audioError?'disabled':''}>开始录制 <kbd>Enter</kbd></button></div><div id="source-hint">${sourceHint()}</div>${audioAlert()}${state.settings?`<div class="settings"><label>画质 <select id="quality"><option ${state.quality==='原画'?'selected':''}>原画</option><option ${state.quality==='高清'?'selected':''}>高清</option><option ${state.quality==='标准'?'selected':''}>标准</option><option ${state.quality==='流畅'?'selected':''}>流畅</option></select></label><p>高清适合办公演示；标准和流畅适合优先减小文件。麦克风开启后才会录入你的讲解。</p></div>`:''}</div>`}
function result(){return `<div class="result"><div class="result-head">${icon('check')}<h2>录像已保存</h2><button class="plain close" data-action="close-result" aria-label="关闭保存结果">${icon('close')}</button></div><div class="file"><strong>录屏_2026-10-16_办公演示.mp4</strong><p>00:12 · 示例大小 4.8 MB · ${state.quality}</p><p>保存到：已配置的录屏目录</p></div>${state.audioError?'<div class="alert">部分人声未录入：录制期间麦克风断开。画面已保存，请先预览核对。</div>':''}<div class="result-actions"><button class="primary" data-stage="preview">预览并裁剪</button><button data-action="folder" class="icon-button">${icon('folder')}打开文件夹</button><button class="plain" data-action="rerecord">再录一次</button></div><p class="result-note">关闭通知后，也可以在「工具 → 最近录制」找回。</p></div>`}
function preview(){return `<div class="preview"><div class="preview-head"><strong>录屏_2026-10-16_办公演示.mp4</strong><span class="grow"></span><button class="plain" data-action="close-preview" aria-label="关闭预览">${icon('close')}</button></div><div class="video-still"><strong>把进展讲清楚</strong><span>${state.playing?'播放状态演示':'录像画面示意 · 非真实视频'}</span></div><div class="playback"><button data-action="play" class="icon-button">${icon(state.playing?'pause':'play')}${state.playing?'暂停':'播放'}</button><span class="time">00:00</span><input type="range" min="0" max="12" value="0" aria-label="播放位置（示意）"><span class="time">00:12</span></div><div class="trim-fields"><label>起点 <input id="trim-in" type="range" min="0" max="11" value="${state.in}" ${state.saved||state.savePending?'disabled':''}><output id="in-value">00:${String(state.in).padStart(2,'0')}</output></label><label>终点 <input id="trim-out" type="range" min="1" max="12" value="${state.out}" ${state.saved||state.savePending?'disabled':''}><output id="out-value">00:${String(state.out).padStart(2,'0')}</output></label></div><p class="muted" id="range-summary">${state.saved?'已另存为新文件：录屏_办公演示_裁剪.mp4':`保留 ${state.in}–${state.out} 秒，共 ${state.out-state.in} 秒`}</p><div class="bar-row"><span class="soft">原录像保留；切点会对齐可用关键帧。</span>${state.saved?'<button data-action="preview-trim" class="primary">预览裁剪文件</button><button data-action="folder">打开文件夹</button>':`<button data-action="reset-trim" id="reset-trim" ${state.savePending?'disabled':''}>重置</button><button data-action="save-trim" id="save-trim" class="primary" ${state.savePending?'disabled':''}>${state.savePending?'正在另存…':'另存裁剪'}</button>`}</div><small id="save-hint">方向键调整起止点；保存前以实际对齐区间为准。</small></div>`}
function recent(){let content=state.recent==='loading'?'<div class="empty" role="status">正在读取最近录制…</div>':state.recent==='error'?'<div class="alert error" role="alert"><strong>暂时无法读取录屏目录</strong><p>没有删除你的录像。请确认保存位置可访问，再重试。</p><button data-action="reload">重新加载</button> <button data-action="folder">打开文件夹</button></div>':state.recent==='empty'?'<div class="empty">这里会显示保存在当前目录的最近录像。<br><button data-action="rerecord" class="primary">开始第一次录制</button></div>':`<div class="record-row">${icon('camera')}<div class="meta"><strong>录屏_2026-10-16_办公演示.mp4</strong><p>00:12 · 4.8 MB · 示例文件</p><div class="bar-row"><button data-stage="preview">预览与裁剪</button><button data-action="folder">打开文件夹</button><button data-action="gif">${state.gif==='running'?'取消导出':state.gif==='done'?'重新导出 GIF':state.gif==='error'?'重试 GIF':'导出 GIF'}</button></div>${state.gif==='running'?'<p role="status">GIF 正在导出 · 示例进度 42%</p>':state.gif==='done'?'<p>GIF 已保存 · 录屏_办公演示.gif</p><button data-action="open-gif">打开 GIF</button> <button data-action="folder">打开文件夹</button>':state.gif==='error'?'<div class="alert error" role="alert">GIF 导出失败。原录像保留，可重试导出。</div>':''}</div></div>`;return `<div class="recent"><div class="bar-row"><h2>最近录制</h2><span class="grow"></span><button class="primary" data-action="rerecord">开始录制</button></div><p class="muted">当前录屏目录 · 最近 5 个 MP4</p><br>${content}${state.saved&&state.recent==='ready'?`<div class="record-row">${icon('camera')}<div class="meta"><strong>录屏_办公演示_裁剪.mp4</strong><p>裁剪产物 · 原录像保留</p><div class="bar-row"><button data-action="preview-trim">预览裁剪文件</button><button data-action="folder">打开文件夹</button></div></div></div>`:''}</div>`}
function setStage(stage){clearTimeout(countdownTimer);state.stage=stage;state.controlMore=false;state.controlCollapsed=false;state.closed=false;state.discard=false;state.settings=false;state.actionError=false;state.playing=false;$('#notice').hidden=true;render()}
function render(){const s=state.stage;document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('selected',b.dataset.stage===s));const n=notes[s]||notes.prepare;$('#note-title').textContent=n[0];$('#note-copy').textContent=n[1];$('#demo-tools').innerHTML='<strong>模拟状态</strong>'+({prepare:'<button data-action="normal">正常</button><button data-action="audio-fail">麦克风不可用</button>',recording:'<button data-action="normal">正常</button><button data-action="audio-fail">麦克风断开</button><button data-action="action-fail">停止失败</button>',done:'<button data-action="normal">正常保存</button><button data-action="audio-fail">人声缺失提醒</button>',preview:'<span class="muted">拖动起止滑块，或用方向键调整；另存保留原录像。</span>',recent:'<button data-action="list-ready">有录像</button><button data-action="list-loading">加载中</button><button data-action="list-empty">空列表</button><button data-action="list-error">读取失败</button><button data-action="gif-done">GIF 完成</button><button data-action="gif-error">GIF 失败</button>'}[s]||'<span class="muted">倒计时可取消，回到录前确认。</span>');let html=desktop();if(s==='prepare')html+=prepare();if(s==='countdown')html+=`<div class="countdown"><div><p>将录制：${targetText()}</p><strong>${state.count}</strong><p>电脑声音 ${state.sys?'开':'关'} · 麦克风 ${state.mic?'开':'关'}</p><button data-action="cancel-count">取消，返回选区 <kbd>Esc</kbd></button></div></div>`;if(s==='recording')html+='<div class="selection recording '+(state.paused?'paused':'')+'" id="selection"></div>'+controls();if(s==='done')html+=result();if(s==='preview')html+=preview();if(s==='recent')html+=recent();if(state.closed)html='<div class="screen-end"><p>覆盖层已关闭</p><button data-action="rerecord">重新打开录屏</button><button data-stage="recent">查看最近录制</button></div>';$('#scene').innerHTML=html;updateSelection()}
function updateSelection(){const el=$('#selection');if(!el)return;let rect=null;const scene=$('#scene');if(state.target==='window'){const a=$('.work-window').getBoundingClientRect(),b=scene.getBoundingClientRect();rect={x:a.x-b.x,y:a.y-b.y,w:a.width,h:a.height}}else if(state.target==='region')rect=state.region;if(rect){Object.assign(el.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'});el.classList.add(state.target)}el.classList.toggle('locked',state.locked);if($('#target-text'))$('#target-text').textContent='将录制：'+targetText();if($('#scope-label'))$('#scope-label').textContent=targetText();if($('#source-hint'))$('#source-hint').innerHTML=sourceHint()}
function announce(message){$('#notice').hidden=false;$('#notice').textContent=message}
function start(){if(state.audioError)return;state.count=3;state.stage='countdown';render();function tick(){if(document.hidden){setStage('prepare');return}state.count--;if(state.count===0){state.paused=false;setStage('recording');return}render();countdownTimer=setTimeout(tick,1000)}countdownTimer=setTimeout(tick,1000)}
function action(a){switch(a){case 'control-more':state.controlMore=!state.controlMore;render();break;case 'collapse-control':state.controlCollapsed=true;state.controlMore=false;render();break;case 'expand-control':state.controlCollapsed=false;render();break;case 'toggle-control-notice':state.controlNotice=!state.controlNotice;render();break;case 'normal':state.audioError=false;state.actionError=false;render();break;case 'full':state.target='full';state.locked=true;state.region=null;render();break;case 'redraw':state.target='full';state.locked=true;render();announce('直接在示例桌面上拖拽画框；松手保留自选区域。');break;case 'sys':state.sys=!state.sys;render();break;case 'mic':state.mic=!state.mic;state.audioError=false;render();break;case 'settings':state.settings=!state.settings;render();break;case 'audio-fail':state.controlNotice=true;state.controlMore=false;state.controlCollapsed=false;state.mic=true;state.audioError=true;render();break;case 'audio-retry':state.audioError=false;render();announce('模拟检查已恢复。实际实现须以音源初始化结果为准。');break;case 'mic-off':state.mic=false;state.audioError=false;render();break;case 'start':start();break;case 'cancel-count':setStage('prepare');break;case 'quit':state.closed=true;render();break;case 'pause':state.paused=!state.paused;render();break;case 'action-fail':state.controlNotice=true;state.controlMore=false;state.controlCollapsed=false;state.actionError=true;render();break;case 'stop':if(state.actionError){render();return}setStage('done');break;case 'retry-stop':state.actionError=false;setStage('done');break;case 'discard':if(state.discard){state.closed=true;render();announce('模拟录像已丢弃，没有创建文件。')}else{state.discard=true;render()}break;case 'keep':state.discard=false;render();break;case 'folder':announce('设计稿演示：正式功能会定位当前文件；这里不会打开或修改真实文件。');break;case 'rerecord':state.controlPos=null;state.audioError=false;state.target='full';state.locked=false;state.saved=false;state.region=null;setStage('prepare');break;case 'close-result':setStage('recent');break;case 'close-preview':if(state.savePending){setStage('recent');announce('裁剪仍在后台保存，可在最近录制查看结果。')}else setStage('recent');break;case 'play':state.playing=!state.playing;render();break;case 'reset-trim':state.in=0;state.out=12;render();break;case 'save-trim':state.savePending=true;$('#save-trim').disabled=true;$('#reset-trim').disabled=true;$('#trim-in').disabled=true;$('#trim-out').disabled=true;$('#save-trim').textContent='正在另存…';$('#save-hint').textContent='正在保存新文件。原录像保留；关闭窗口后会继续保存。';saveTimer=setTimeout(()=>{state.savePending=false;state.saved=true;if(['preview','recent'].includes(state.stage))render();if(state.stage!=='preview')announce('模拟裁剪文件已保存，可从最近录制预览。')},1600);break;case 'preview-trim':announce('设计稿演示：正式功能会切换至刚保存的裁剪文件，核对画面与声音。');break;case 'reload':state.recent='ready';render();break;case 'gif':state.gif=state.gif==='running'?'idle':'running';render();break;case 'gif-done':state.recent='ready';state.gif='done';render();break;case 'gif-error':state.recent='ready';state.gif='error';render();break;case 'open-gif':announce('设计稿演示：正式功能会打开刚导出的 GIF。');break;default:if(a.startsWith('list-')){state.recent=a.slice(5);render()}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.stage){setStage(b.dataset.stage);return}if(b.dataset.action)action(b.dataset.action)});
$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('#theme').textContent=light?'切换深色':'切换浅色'};
document.addEventListener('change',e=>{if(e.target.id==='quality'){state.quality=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='trim-in'){state.in=Math.min(Number(e.target.value),state.out-1);e.target.value=state.in;$('#in-value').textContent='00:'+String(state.in).padStart(2,'0')}if(e.target.id==='trim-out'){state.out=Math.max(Number(e.target.value),state.in+1);e.target.value=state.out;$('#out-value').textContent='00:'+String(state.out).padStart(2,'0')}if(['trim-in','trim-out'].includes(e.target.id))$('#range-summary').textContent=`保留 ${state.in}–${state.out} 秒，共 ${state.out-state.in} 秒`});
function point(e){const r=$('#scene').getBoundingClientRect();return{x:Math.max(4,Math.min(r.width-4,e.clientX-r.left)),y:Math.max(4,Math.min(r.height-4,e.clientY-r.top))}}
$('#scene').addEventListener('pointerdown',e=>{if(state.stage!=='prepare'||state.closed||e.target.closest('.toolbar,button,input,select'))return;const p=point(e);drag={...p,moved:false};$('#scene').setPointerCapture(e.pointerId)});
$('#scene').addEventListener('pointermove',e=>{if(state.stage!=='prepare'||state.closed||e.target.closest('.toolbar'))return;const p=point(e);if(drag){if(Math.hypot(p.x-drag.x,p.y-drag.y)>4)drag.moved=true;if(drag.moved){state.target='region';state.locked=true;state.region={x:Math.min(p.x,drag.x),y:Math.min(p.y,drag.y),w:Math.max(1,Math.abs(p.x-drag.x)),h:Math.max(1,Math.abs(p.y-drag.y))};updateSelection()}return}if(!state.locked){const w=$('.work-window').getBoundingClientRect();state.target=e.clientX>=w.left&&e.clientX<=w.right&&e.clientY>=w.top&&e.clientY<=w.bottom?'window':'full';const sel=$('#selection');sel.removeAttribute('style');sel.classList.remove('window','region');updateSelection()}});
$('#scene').addEventListener('pointerup',()=>{if(!drag)return;if(!drag.moved)state.locked=true;if(drag.moved&&(state.region.w<16||state.region.h<16)){state.target='full';state.region=null;announce('区域太小，请重新拖拽；尚未开始录制。')}drag=null;render()});
$('#scene').addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.stage==='recording'&&state.controlMore){state.controlMore=false;render();return}if(state.stage==='countdown'){e.preventDefault();setStage('prepare')}else if(state.stage==='prepare'){if(state.settings){state.settings=false;render()}else if(state.locked){state.target='full';state.locked=false;state.region=null;render()}else{state.closed=true;render()}}else if(state.stage==='preview'){if(state.savePending){announce('正在另存文件，Esc 不会取消保存；可关闭预览并在后台继续。')}else if(state.in!==0||state.out!==12){state.in=0;state.out=12;render()}else setStage('recent')}}if(e.key==='Enter'&&state.stage==='prepare'&&!state.closed&&!e.target.closest('button,input,select'))start();if(e.code==='Space'&&state.stage==='preview'&&!e.target.closest('button,input,select')){e.preventDefault();action('play')}});

let miniDrag=null;
document.addEventListener('pointerdown',e=>{
 const grip=e.target.closest('[data-rec-grip]');if(!grip)return;
 const bar=$('#record-toolbar'),r=bar.getBoundingClientRect(),scene=$('#scene').getBoundingClientRect();
 miniDrag={dx:e.clientX-r.left,dy:e.clientY-r.top};
 state.controlPos={x:r.left-scene.left,y:r.top-scene.top};
 grip.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!miniDrag)return;
 const bar=$('#record-toolbar');if(!bar){miniDrag=null;return}
 const r=$('#scene').getBoundingClientRect();
 const x=Math.max(8,Math.min(r.width-bar.offsetWidth-8,e.clientX-r.left-miniDrag.dx));
 const y=Math.max(8,Math.min(r.height-bar.offsetHeight-8,e.clientY-r.top-miniDrag.dy));
 state.controlPos={x,y};Object.assign(bar.style,{left:x+'px',top:y+'px',bottom:'auto',transform:'none'});
 bar.classList.toggle('near-top',y<200);
});
document.addEventListener('pointerup',()=>{miniDrag=null});
document.addEventListener('pointercancel',()=>{miniDrag=null});

window.addEventListener('resize',()=>{state.controlPos=null;if(state.target==='region'){state.target='full';state.region=null;state.locked=false}render()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.stage==='countdown')setStage('prepare')});
render();
</script>
</body>
</html>
