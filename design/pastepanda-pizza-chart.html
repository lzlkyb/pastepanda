<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像能力图 · StatsBomb 披萨图效果稿</title>
<style>
  :root {
    --bg: #0f1520;
    --surface: rgba(22,32,46,0.85);
    --surface2: #1b2735;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8edf4;
    --text2: #a8b3c2;
    --text3: #6b7688;
    --accent: #4fa3ff;
    --cyan: #38e1d4;
    --purple: #9d7bff;
    --green: #34d399;
    --pink: #ff7ab6;
    --amber: #f5a623;
    --font: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1000px 700px at 70% -10%, #16233a 0%, #0b1018 55%);
    font-family: var(--font);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 30px 16px;
  }
  .wrap { width: 560px; display: flex; flex-direction: column; gap: 14px; }
  .title {
    font-size: 13px; font-weight: 600; color: var(--text);
    letter-spacing: 0.4px;
  }
  .title span { font-size: 11px; color: var(--text3); font-weight: 400; margin-left: 8px; }

  .card {
    display: flex; align-items: center; gap: 26px;
    padding: 22px 24px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border2);
    backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .chartSide { flex-shrink: 0; }
  .legendSide { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lgRow { display: flex; align-items: center; gap: 10px; }
  .lgDot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .lgName { font-size: 12px; color: var(--text2); width: 64px; }
  .lgVal { font-size: 13px; font-weight: 700; color: var(--text); margin-left: auto; }
  .lgVal small { font-size: 10px; color: var(--text3); font-weight: 400; }
  .lgBarBg { width: 100%; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .lgBar { height: 100%; border-radius: 99px; }
  .note {
    font-size: 10.5px; color: var(--text3); line-height: 1.7;
  }
  .note b { color: var(--text2); }
  .switchRow { display: flex; gap: 8px; }
  .sw {
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--text2); font-size: 11px; cursor: pointer; font-family: var(--font);
  }
  .sw.on { border-color: var(--accent); background: rgba(79,163,255,0.13); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    🍕 能力画像 · 披萨图（StatsBomb 风格）
    <span>中心 = 0，径向条长度 = 归一化分数（最强项 = 满格）</span>
  </div>

  <div class="card">
    <div class="chartSide">
      <svg width="250" height="250" viewBox="0 0 250 250">
        <!-- 刻度环：25 / 50 / 75 / 100% -->
        <g fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="2 3">
          <circle cx="125" cy="125" r="22.5"/>
          <circle cx="125" cy="125" r="45"/>
          <circle cx="125" cy="125" r="67.5"/>
          <circle cx="125" cy="125" r="90"/>
        </g>
        <!-- 100% 外圈实线 -->
        <circle cx="125" cy="125" r="90" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

        <!-- 维度条（从中心发散，stroke-linecap round = 披萨片） -->
        <!-- developer 100% -->
        <line x1="125" y1="125" x2="125" y2="35" stroke="#4fa3ff" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
        <!-- research 48% -->
        <line x1="125" y1="125" x2="162" y2="103" stroke="#38e1d4" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
        <!-- writer 31% -->
        <line x1="125" y1="125" x2="151" y2="147" stroke="#9d7bff" stroke-width="16" stroke-linecap="round" opacity="0.65"/>
        <!-- comm 22% -->
        <line x1="125" y1="125" x2="125" y2="145" stroke="#ff7ab6" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
        <!-- ops 12% -->
        <line x1="125" y1="125" x2="99" y2="147" stroke="#f5a623" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
        <!-- data 10% -->
        <line x1="125" y1="125" x2="88" y2="103" stroke="#34d399" stroke-width="16" stroke-linecap="round" opacity="0.5"/>

        <!-- 维度标签（外圈） -->
        <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
          <text x="125" y="22" font-size="11.5" font-weight="600" fill="#e8edf4">开发</text>
          <text x="196" y="92" font-size="11.5" font-weight="600" fill="#e8edf4" text-anchor="start">研究</text>
          <text x="196" y="168" font-size="11.5" font-weight="600" fill="#e8edf4" text-anchor="start">文案</text>
          <text x="125" y="222" font-size="11.5" font-weight="600" fill="#e8edf4">沟通</text>
          <text x="54" y="168" font-size="11.5" font-weight="600" fill="#e8edf4" text-anchor="end">运营</text>
          <text x="54" y="92" font-size="11.5" font-weight="600" fill="#e8edf4" text-anchor="end">数据</text>
        </g>

        <!-- 数值（条末端） -->
        <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
          <text x="125" y="76" font-size="10" font-weight="600" fill="#4fa3ff">100%</text>
          <text x="168" y="118" font-size="10" font-weight="600" fill="#38e1d4" text-anchor="start">48%</text>
          <text x="157" y="152" font-size="10" font-weight="600" fill="#9d7bff" text-anchor="start">31%</text>
          <text x="125" y="166" font-size="10" font-weight="600" fill="#ff7ab6">22%</text>
          <text x="93" y="152" font-size="10" font-weight="600" fill="#f5a623" text-anchor="end">12%</text>
          <text x="82" y="118" font-size="10" font-weight="600" fill="#34d399" text-anchor="end">10%</text>
        </g>

        <!-- 中心点 -->
        <circle cx="125" cy="125" r="3.5" fill="rgba(255,255,255,0.5)"/>
      </svg>
    </div>

    <div class="legendSide">
      <div class="lgRow">
        <span class="lgDot" style="background:#4fa3ff"></span>
        <span class="lgName">开发</span>
        <span class="lgVal">100%<small> 主导</small></span>
        <div class="lgBarBg"><div class="lgBar" style="width:100%;background:linear-gradient(90deg,#4fa3ff,#38e1d4)"></div></div>
      </div>
      <div class="lgRow">
        <span class="lgDot" style="background:#38e1d4"></span>
        <span class="lgName">研究</span>
        <span class="lgVal">48%</span>
        <div class="lgBarBg"><div class="lgBar" style="width:48%;background:#38e1d4"></div></div>
      </div>
      <div class="lgRow">
        <span class="lgDot" style="background:#9d7bff"></span>
        <span class="lgName">文案</span>
        <span class="lgVal">31%</span>
        <div class="lgBarBg"><div class="lgBar" style="width:31%;background:#9d7bff"></div></div>
      </div>
      <div class="lgRow">
        <span class="lgDot" style="background:#ff7ab6"></span>
        <span class="lgName">沟通</span>
        <span class="lgVal">22%</span>
        <div class="lgBarBg"><div class="lgBar" style="width:22%;background:#ff7ab6"></div></div>
      </div>
      <div class="lgRow">
        <span class="lgDot" style="background:#f5a623"></span>
        <span class="lgName">运营</span>
        <span class="lgVal">12%</span>
        <div class="lgBarBg"><div class="lgBar" style="width:12%;background:#f5a623"></div></div>
      </div>
      <div class="lgRow">
        <span class="lgDot" style="background:#34d399"></span>
        <span class="lgName">数据</span>
        <span class="lgVal">10%</span>
        <div class="lgBarBg"><div class="lgBar" style="width:10%;background:#34d399"></div></div>
      </div>
    </div>
  </div>

  <div class="note">
    <b>设计说明（StatsBomb 规范）：</b>每个维度一根<b>从中心发散的圆角条</b>（stroke-linecap round），
    长度 = 归一化分数；虚线刻度环提供 25/50/75/100% 参照；主导角色满格高亮 + 多彩区分维度。
    与雷达图相比：<b>精确读值更直观</b>（条长即数值），形状叙事弱一些——适合"一眼看数值"；
    雷达图适合"一眼看形状"。两者数据相同，可随时切换。
  </div>
</div>
</body>
</html>
