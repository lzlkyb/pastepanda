<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastePanda · Mac 贴图预览</title><style>
:root{--surface:#fff;--background:#e9edf2;--text:#18212e;--muted:#536174;--stroke:#cad2dd;--overlay:#1a1e28;--inverse:#fff;--accent:#365cc6;--danger:#bc2838}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:30px 36px;max-width:820px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.7;color:var(--muted);margin:8px 0}.badge{font-size:12px;border:1px solid var(--stroke);padding:5px 9px;border-radius:20px}button{font:inherit;cursor:pointer;border:1px solid var(--stroke);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:8px}button:hover{background:var(--background)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.stage{height:550px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--background),var(--surface));border-block:1px solid var(--stroke)}.desk{position:absolute;inset:50px 13%;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:30px;pointer-events:none;color:var(--muted)}.desk h2{color:var(--text);font-size:18px}.line{height:9px;background:var(--background);margin:19px 0;width:70%}.pin{position:absolute;left:calc(50% - 180px);top:140px;width:360px;height:240px;box-shadow:0 15px 36px #18212e33;border:1px solid var(--stroke);background:var(--surface);touch-action:none;cursor:move}.image{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.image svg{flex-shrink:0}.actions{position:absolute;top:8px;right:8px;display:flex;gap:5px}.actions button{background:var(--overlay);color:var(--inverse);border:0;padding:5px 9px;font-size:12px}.actions .close:hover{background:var(--danger)}.status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--overlay);color:var(--inverse);padding:7px 11px;border-radius:7px;white-space:nowrap;font-size:12px;pointer-events:none}.menu{position:absolute;right:8px;top:40px;width:218px;background:var(--surface);border:1px solid var(--stroke);border-radius:9px;box-shadow:0 8px 25px #18212e26;padding:6px;z-index:2;cursor:default}.menu button{display:flex;justify-content:space-between;width:100%;border:0;text-align:left;font-size:13px;padding:8px}.menu kbd{color:var(--muted)}.menu hr{border:0;border-top:1px solid var(--stroke);margin:5px}footer{padding:20px 36px;max-width:850px}footer button{margin-top:10px} [hidden]{display:none!important}
</style><header><span class="badge">交互设计稿 · 功能尚未接入</span><h1 style="margin-top:16px">Mac 上的浮动贴图</h1><p>保留现有贴图的拖动、滚轮缩放、旋转、翻转与透明度操作。复制改用 Mac 的 Command+C；结果在贴图上短暂显示，不持续遮住图片。</p></header><section class="stage" id="stage"><div class="desk"><h2>你的工作窗口</h2><p>贴图浮在其它窗口上，方便边看边工作。</p><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="pin" id="pin" tabindex="0" aria-label="示例浮动贴图，可拖动或滚轮缩放"><div class="image"><svg id="image" width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="示例图片：剪贴板、搜索与笔记的关系"><rect width="360" height="240" fill="#fff"/><text x="25" y="38" fill="#18212e" font-size="17">从复制到知识</text><path d="M67 119h227" stroke="#9cacbd" stroke-width="2"/><g fill="#eaf0ff" stroke="#bccaf0"><rect x="24" y="82" width="88" height="72" rx="8"/><rect x="136" y="82" width="88" height="72" rx="8"/><rect x="248" y="82" width="88" height="72" rx="8"/></g><g fill="#24427d" font-size="14" text-anchor="middle"><text x="68" y="125">剪贴板</text><text x="180" y="125">搜索</text><text x="292" y="125">笔记</text></g><text x="25" y="209" fill="#536174" font-size="12">示例内容 · 不涉及真实剪贴板数据</text></svg></div><div class="actions"><button id="more" aria-expanded="false">更多</button><button id="close" class="close" title="关闭贴图（Esc）">关闭</button></div><div class="status" id="status" role="status" hidden></div><div class="menu" id="menu" hidden><button data-action="copy">复制图片<kbd>⌘C</kbd></button><button data-action="ocr">复制文字</button><button data-action="edit">重新编辑</button><hr><button data-action="rotate">旋转 90°<kbd>R</kbd></button><button data-action="flip">水平翻转<kbd>F</kbd></button><button data-action="vertical">垂直翻转</button><button data-action="opacity">调整透明度<kbd>T</kbd></button><button data-action="reset">恢复原样<kbd>0</kbd></button><hr><button data-action="close">关闭贴图<kbd>Esc</kbd></button></div></div></section><footer><p>试一试：拖动图片、滚轮缩放、打开“更多”。OCR、复制和编辑只演示反馈，不读取或修改剪贴板。关闭后可点下方按钮恢复。</p><button id="restore">恢复示例贴图</button></footer><script>
const pin=document.getElementById('pin'),image=document.getElementById('image'),menu=document.getElementById('menu'),more=document.getElementById('more'),status=document.getElementById('status');let rotation=0,flip=1,vertical=1,scale=1,opacity=1,timer,drag;function flash(text){clearTimeout(timer);status.textContent=text;status.hidden=false;timer=setTimeout(()=>status.hidden=true,1500)}function render(){const turned=rotation%180!==0;pin.style.width=(turned?240:360)*scale+'px';pin.style.height=(turned?360:240)*scale+'px';image.style.transform=`rotate(${rotation}deg) scale(${scale*flip},${scale*vertical})`;pin.style.opacity=opacity;flash(`${Math.round(scale*100)}% · ${rotation}° · 透明度 ${Math.round(opacity*100)}%`)}function closeMenu(){menu.hidden=true;more.setAttribute('aria-expanded','false')}function action(name){closeMenu();if(name==='copy')flash('示意：图片已复制');if(name==='ocr')flash('示意：已复制识别文字');if(name==='edit')flash('示意：返回现有截图编辑器');if(name==='rotate'){rotation=(rotation+90)%360;render()}if(name==='flip'){flip*=-1;render()}if(name==='vertical'){vertical*=-1;render()}if(name==='opacity'){opacity=opacity<=.4?1:opacity-.2;render()}if(name==='reset'){rotation=0;flip=vertical=scale=opacity=1;render()}if(name==='close')pin.hidden=true}more.onclick=()=>{menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden))};document.getElementById('close').onclick=()=>action('close');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>action(b.dataset.action));pin.oncontextmenu=e=>{e.preventDefault();menu.hidden=false;more.setAttribute('aria-expanded','true')};pin.onwheel=e=>{e.preventDefault();scale=Math.max(.25,Math.min(2,scale+(e.deltaY<0?.05:-.05)));render()};pin.onpointerdown=e=>{if(e.target.closest('button,.menu'))return;pin.focus();drag={x:e.clientX,y:e.clientY,left:pin.offsetLeft,top:pin.offsetTop};pin.setPointerCapture(e.pointerId)};pin.onpointermove=e=>{if(!drag)return;pin.style.left=Math.max(0,Math.min(document.getElementById('stage').clientWidth-80,drag.left+e.clientX-drag.x))+'px';pin.style.top=Math.max(0,Math.min(480,drag.top+e.clientY-drag.y))+'px'};pin.onpointerup=()=>drag=null;pin.onkeydown=e=>{if(e.key==='Escape'){if(!menu.hidden)closeMenu();else action('close');e.preventDefault();return}const map={r:'rotate',f:'flip',t:'opacity','0':'reset'};if(map[e.key.toLowerCase()])action(map[e.key.toLowerCase()]);if(e.metaKey&&e.key.toLowerCase()==='c'){e.preventDefault();action('copy')}};document.getElementById('restore').onclick=()=>{pin.hidden=false;action('reset')};
</script></html>
