[package]
name = "pastepanda"
version = "5.11.0"
description = "PastePanda - Smart Clipboard Manager"
authors = ["you"]
edition = "2021"

[[bin]]
name = "PastePanda"
path = "src/main.rs"

[lib]
name = "pastepanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.21"
arboard = { version = "3", features = ["image-data"] }
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["png"] }
md-5 = "0.10"
base64 = "0.22"
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
pinyin = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
regex = "1"
url = "2"
csv = "1"
rust_xlsxwriter = "0.8"
serde_yaml = "0.9"
encoding_rs = "0.8"
chardetng = "0.1"
# 云端 AI 地基（阶段 B0）：OpenAI 兼容的 /chat/completions 调用。
# 用 rustls 而非 native-tls：免掉 OpenSSL 构建依赖，也不绑定系统 schannel 版本。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# tree-sitter 语言仲裁层（方案 B）：规则引擎存疑时用真实语法解析投票定语言
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    # DPAPI（CryptProtectData）：加密 AI API Key，避免它进明文的 config 表
    "Win32_Security_Cryptography",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation_Collections",
    "Globalization",
] }
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
