[package]
name = "pastepanda"
version = "7.1.0"
description = "PastePanda - Smart Clipboard Manager"
authors = ["you"]
edition = "2021"

[[bin]]
name = "PastePanda"
path = "src/main.rs"

[lib]
name = "pastepanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.21"
arboard = { version = "3", features = ["image-data"] }
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["png"] }
# PP-OCRv6 离线 OCR 引擎（纯 Rust + MNN，模型随包发布）。替换原 Windows 自带 OCR，
# 中文识别率更高且跨平台。模型文件放在 resources/ocr_models/（见 tauri.conf.json）。
# OCR 引擎：PP-OCRv6（MNN 推理）。ocr-rs 源码 vendoring 在 vendor/ocr-rs，
# 其 build 脚本会优先读取 vendor/ocr-rs/3rd_party/prebuilt/ 里的预编译 MNN，
# 因此构建完全离线、不再联网下载（预编译已 gitignore，见 .gitignore）。
ocr-rs = "2.4.1"
md-5 = "0.10"
base64 = "0.22"
ring = "0.17"

# M6 传输层。LAN 直连与跨网打洞/relay 用同一套栈——不做「LAN 一套 + WAN 一套」，
# 那样同一对设备在不同网络下走不同代码路径，bug 与所在地点相关最难查。
#
# 探针结论（probe/iroh，2026-09-04 真跑）：离线局域网直连成立、净增体积 3.94MB。
#
# feature 取舍：
#   · tls-ring   必须——预设要 crypto provider，且项目本来就用 ring（不引第二套）
#   · portmapper 保留——UPnP/PCP 提高 NAT 打洞成功率，而跨网是硬需求
#   · metrics    去掉——我们不采集
#   · fast-apple-datapath 去掉——macOS only
iroh = { version = "1.1", default-features = false, features = [
    "tls-ring",
    "portmapper",
] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
pinyin = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
regex = "1"
url = "2"
csv = "1"
rust_xlsxwriter = "0.8"
serde_yaml = "0.9"
encoding_rs = "0.8"
chardetng = "0.1"
# 云端 AI 地基（阶段 B0）：OpenAI 兼容的 /chat/completions 调用。
# 用 rustls 而非 native-tls：免掉 OpenSSL 构建依赖，也不绑定系统 schannel 版本。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# v6.10 流式输出：SSE 逐块解析（reqwest bytes_stream 的 StreamExt）
futures-util = "0.3"
# 知识库 MCP Server（M4）的 HTTP 传输层。MCP 协议本身是手写的（src/mcp/protocol.rs），
# 不引任何 MCP SDK；axum 只管 HTTP。
# 体积：hyper / tower / http 已由 reqwest 带进 Cargo.lock，实测 axum 只增 ~160 KB、
# 零新重复依赖（参照实现 cc-bridge 安装包 4.5MB 就含 axum）。
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }   # ConcurrencyLimitLayer
# 只要 limit：不启 `compression-gzip`，本服务绑回环，压缩收益近零
# 却要拖一整梯 async-compression（理由同不抄 per-IP 限流，见 src/mcp/auth.rs）。
tower-http = { version = "0.6", features = ["limit"] }
# tree-sitter 语言仲裁层（方案 B）：规则引擎存疑时用真实语法解析投票定语言
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"

[dev-dependencies]
# v6.10 测试基建：本地 mock OpenAI 服务（tiny_http 轻量、仅测试用，不进发布包）
tiny_http = "0.12"
# ⚠ 不要为了测试加 `tauri = { features = ["test"] }`。实测：开启它会让
# getrandom 0.3 的 Windows 后端变成可达代码，test exe 于是静态导入
# `bcryptprimitives.dll!ProcessPrng`——本机 Windows 11 build 22000 没有这个导出，
# 整个 lib test 二进制启动即挂（0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND，
# 一条测试都跑不了）。MCP 过线测试因此不用 mock_app，见 src/mcp/tests.rs。

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # 截图控件级吸附 Tier2：UI Automation / MSAA 取现代 App（Chrome/Edge/VS Code/Electron/WPF/UWP/Qt）的逻辑控件
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    # DPAPI（CryptProtectData）：加密 AI API Key，避免它进明文的 config 表
    "Win32_Security_Cryptography",
] }
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# 开发构建：把链接时间压下去（2026-09-05）。
#
# 本机实测：916 个依赖、`cargo check` 单跑 9 分 14 秒。
# 之前这里**一条配置都没有**，用的是 Rust 默认 `debug = true`，
# 于是每个依赖都带完整调试信息——而 Windows MSVC 链接 debuginfo 极慢。
#
# 🔴 两条分开写是有意的：
# - 自己的代码留 `line-tables-only`：panic backtrace 的行号照常准，
#   只是没了变量/类型信息（真要单步调试时临时改回 `true` 即可）
# - 依赖直接 `false`：几乎不会单步进 `windows-sys` / `iroh`，
#   但它们的调试信息每次链接都要处理一遍
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"
panic = "abort"

# 离线 OCR 构建：把 ocr-rs 重定向到仓库内 vendoring 副本，
# 其 build 脚本会直接读取 vendor/ocr-rs/3rd_party/prebuilt/ 下的预编译 MNN，
# 不再联网下载。
[patch.crates-io]
ocr-rs = { path = "vendor/ocr-rs" }
