[package]
name = "pastepanda"
version = "6.17.2"
description = "PastePanda - Smart Clipboard Manager"
authors = ["you"]
edition = "2021"

[[bin]]
name = "PastePanda"
path = "src/main.rs"

[lib]
name = "pastepanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.21"
arboard = { version = "3", features = ["image-data"] }
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["png"] }
# PP-OCRv6 离线 OCR 引擎（纯 Rust + MNN，模型随包发布）。替换原 Windows 自带 OCR，
# 中文识别率更高且跨平台。模型文件放在 resources/ocr_models/（见 tauri.conf.json）。
# OCR 引擎：PP-OCRv6（MNN 推理）。ocr-rs 源码 vendoring 在 vendor/ocr-rs，
# 其 build 脚本会优先读取 vendor/ocr-rs/3rd_party/prebuilt/ 里的预编译 MNN，
# 因此构建完全离线、不再联网下载（预编译已 gitignore，见 .gitignore）。
ocr-rs = "2.4.1"
md-5 = "0.10"
base64 = "0.22"
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
pinyin = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
regex = "1"
url = "2"
csv = "1"
rust_xlsxwriter = "0.8"
serde_yaml = "0.9"
encoding_rs = "0.8"
chardetng = "0.1"
# 云端 AI 地基（阶段 B0）：OpenAI 兼容的 /chat/completions 调用。
# 用 rustls 而非 native-tls：免掉 OpenSSL 构建依赖，也不绑定系统 schannel 版本。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# v6.10 流式输出：SSE 逐块解析（reqwest bytes_stream 的 StreamExt）
futures-util = "0.3"
# tree-sitter 语言仲裁层（方案 B）：规则引擎存疑时用真实语法解析投票定语言
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"

[dev-dependencies]
# v6.10 测试基建：本地 mock OpenAI 服务（tiny_http 轻量、仅测试用，不进发布包）
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    # DPAPI（CryptProtectData）：加密 AI API Key，避免它进明文的 config 表
    "Win32_Security_Cryptography",
] }
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"
panic = "abort"

# 离线 OCR 构建：把 ocr-rs 重定向到仓库内 vendoring 副本，
# 其 build 脚本会直接读取 vendor/ocr-rs/3rd_party/prebuilt/ 下的预编译 MNN，
# 不再联网下载。
[patch.crates-io]
ocr-rs = { path = "vendor/ocr-rs" }
