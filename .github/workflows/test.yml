name: Test

on:
  push:
    branches: [master, "feature/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ============================================================
  # Rust 后端测试
  # ============================================================
  rust-test:
    name: Rust Tests
    runs-on: windows-latest
    # 2026-09-14：Post 缓存上传曾把 job 挂死 >1h（测试本身已过）。
    # 没有 timeout 时 Actions 会无限等；30min 到点自动失败，可重跑。
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          # 🔴 不缓存 src-tauri/target：编译产物常达数 GB，
          #    actions/cache 收尾上传会挂死（实测 2026-09-14）。
          #    只缓 registry/git：依赖编译仍是大头，但上传量可控。
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 缓存 MNN 预编译（避免每次构建联网下载 180MB）
        uses: actions/cache@v4
        with:
          path: src-tauri/vendor/ocr-rs/3rd_party/prebuilt
          key: ${{ runner.os }}-mnn-prebuilt-dev
          restore-keys: ${{ runner.os }}-mnn-prebuilt-

      - name: 运行 Rust 测试
        run: cargo test
        working-directory: src-tauri

  # ============================================================
  # 前端测试
  # ============================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 运行 Vitest
        run: npx vitest run
