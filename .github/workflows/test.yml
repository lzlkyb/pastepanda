name: Test

on:
  push:
    branches: [master, "feature/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ============================================================
  # Rust 后端测试
  # ============================================================
  rust-test:
    name: Rust Tests
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 缓存 MNN 预编译（避免每次构建联网下载 180MB）
        uses: actions/cache@v4
        with:
          path: src-tauri/vendor/ocr-rs/3rd_party/prebuilt
          key: ${{ runner.os }}-mnn-prebuilt-dev
          restore-keys: ${{ runner.os }}-mnn-prebuilt-

      - name: 运行 Rust 测试
        run: cargo test
        working-directory: src-tauri

  # ============================================================
  # 前端测试
  # ============================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 运行 Vitest
        run: npx vitest run
