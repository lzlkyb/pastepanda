name: Release
run-name: ${{ github.ref_name }} - ${{ github.event.head_commit.message }}

# 当推送 v* 格式的 tag 时触发（如 v5.0.37）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 5.0.37）"
        required: true

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔑 准备签名密钥（文件路径方式）
        shell: pwsh
        run: |
          $raw = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          $keyFile = "${{ runner.temp }}\tauri-signing.key"

          # 写入密钥文件（二进制安全）
          [System.IO.File]::WriteAllText($keyFile, $raw, [System.Text.Encoding]::ASCII)

          # 验证文件
          $content = Get-Content $keyFile -Raw
          $expectedPrefix = 'dW50cnVzdGVk'
          $expectedLength = 348

          Write-Host "========================================"
          Write-Host "  密钥验证"
          Write-Host "========================================"
          Write-Host "Secret 长度: $($raw.Length)"
          Write-Host "文件长度: $($content.Length)"
          Write-Host "期望长度: $expectedLength"
          Write-Host "以 '$expectedPrefix' 开头: $($content.StartsWith($expectedPrefix))"

          if ($content.Length -ne $expectedLength -or -not $content.StartsWith($expectedPrefix)) {
            Write-Host "`n❌ 密钥格式不正确!"
            Write-Host "前30字符: $($content.Substring(0, [Math]::Min(30, $content.Length)))"
            Write-Host "`n修复: 去 GitHub Secrets 更新 TAURI_SIGNING_PRIVATE_KEY"
            Write-Host "值必须以 'dW50cnVzdGVk' 开头, 长度 348 字符"
            Write-Host "正确值来自: npx tauri signer generate --ci 生成的 .key 文件"
            exit 1
          }

          try {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($content))
            if ($decoded.StartsWith('untrusted comment: rsign encrypted secret key')) {
              Write-Host "✅ 密钥验证通过 (minisign 格式)"
            } else {
              Write-Host "❌ 解码后格式不对: $($decoded.Substring(0, [Math]::Min(40, $decoded.Length)))"
              exit 1
            }
          } catch {
            Write-Host "❌ Base64 解码失败: $($_.Exception.Message)"
            exit 1
          }

          # 设置文件路径供后续步骤使用
          "TAURI_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
          Write-Host "密钥文件: $keyFile"
          Write-Host "========================================"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 sccache 缓存
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: 安装前端依赖
        run: |
          rm package-lock.json -ErrorAction SilentlyContinue
          rm -r node_modules -ErrorAction SilentlyContinue
          npm install

      - name: 缓存 MNN 预编译（避免每次构建联网下载 180MB）
        uses: actions/cache@v4
        with:
          path: src-tauri/vendor/ocr-rs/3rd_party/prebuilt
          key: ${{ runner.os }}-mnn-prebuilt-dev
          restore-keys: ${{ runner.os }}-mnn-prebuilt-

      - name: 构建 Tauri 应用
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_KEY_FILE
          npx tauri build

      - name: 列出构建产物（调试）
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== nsis 目录 ==="
          if (Test-Path src-tauri/target/release/bundle/nsis/) {
            Get-ChildItem src-tauri/target/release/bundle/nsis/
          } else {
            Write-Host "nsis 目录不存在"
          }
          Write-Host ""
          Write-Host "=== 查找 .sig 文件 ==="
          $sigFiles = Get-ChildItem -Recurse src-tauri/target/release/bundle/ -Filter "*.sig" -ErrorAction SilentlyContinue
          if ($sigFiles) { $sigFiles } else { Write-Host "未找到 .sig 文件" }
          Write-Host ""
          Write-Host "=== 查找 .exe 文件 ==="
          $exeFiles = Get-ChildItem -Recurse src-tauri/target/release/bundle/ -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) { $exeFiles } else { Write-Host "未找到 .exe 文件" }

      - name: 打包绿色便携版
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = "src-tauri/target/release/PastePanda.exe"
          $zipName = "PastePanda_$version`_x86_64-pc-windows-msvc.zip"

          if (-not (Test-Path $exePath)) {
            Write-Host "❌ 绿色版 exe 不存在: $exePath"
            exit 1
          }

          $exeDir = Split-Path $exePath -Parent
          $exeName = Split-Path $exePath -Leaf
          $zipFullPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Push-Location $exeDir
          Compress-Archive -Path $exeName -DestinationPath $zipFullPath -Force
          Pop-Location

          Write-Host "✅ 绿色版打包完成: $zipName"
          Write-Host "文件大小: $((Get-Item $zipFullPath).Length / 1MB) MB"

      - name: 提取更新日志
        id: changelog
        # 用 Node 脚本替代内联 pwsh 正则：UTF-8 读取 + /\r?\n/ 分行，免疫
        # Windows runner autocrlf 检出产生的 CRLF（v5.1.2/v5.2.0 曾因此提取
        # 失败回退"常规构建发布"）。段落缺失/为空时脚本 exit 1 红灯中止发版，
        # 不再静默兜底。输出 release_body / updater_notes 写入 GITHUB_OUTPUT。
        run: node scripts/extract-release-notes.mjs

      - name: 生成 updater.json（ghproxy 镜像下载源）
        run: node scripts/generate-updater-json.mjs
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_NOTES: ${{ steps.changelog.outputs.updater_notes }}
          UPDATER_DOWNLOAD_BASE: "https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download"

      - name: 校验 updater.json（发布前冒烟，防止坏产物静默发布）
        run: node scripts/verify-updater-json.mjs dist/updater.json

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🐼 PastePanda ${{ github.ref_name }}"
          body: |
            ## 🐼 PastePanda ${{ github.ref_name }}

            > 智能剪贴板管理器 — 轻量、高效、美观

            ---

            ${{ steps.changelog.outputs.release_body }}

            ---

            ### ⚠️ 升级提醒
            - 升级后所有设置和剪贴板数据保持不变，无需额外操作

            ---

            ### 📦 下载
            - **安装版**：下载 `PastePanda_*_x64-setup.exe`，运行安装程序（支持自动更新）
            - **绿色便携版**：下载 `PastePanda_*_x86_64-pc-windows-msvc.zip`，解压即用（更新后变为已安装状态）

            ---

            <sub>🤖 本 Release 由 CI 根据 commit 前缀自动生成 | [提交规范](#)：`feat:` 新功能 · `chg:` 变更 · `fix:` 修复 · `refactor:` 重构 · `docs:` 文档</sub>
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            PastePanda_*_x86_64-pc-windows-msvc.zip
            dist/updater.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      # ─── Gitee 镜像同步（可选，解决国内用户直连 GitHub 不稳定问题）───
      # 两个 secret（GITEE_TOKEN/GITEE_REPOSITORY）未配置时自动跳过，不影响现有发版流程。

      - name: 生成 updater-gitee.json（Gitee 镜像 manifest，可选）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.GITEE_REPOSITORY }}")) {
            Write-Host "⚠️ 未配置 GITEE_REPOSITORY secret，跳过 Gitee 镜像 manifest 生成"
            exit 0
          }
          node scripts/generate-updater-json.mjs
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_NOTES: ${{ steps.changelog.outputs.updater_notes }}
          # Gitee raw 文件直链格式与 GitHub Release 不同，用 UPDATER_URL_TEMPLATE 完全接管拼接
          # 固定走 releases 分支下的 latest/ 目录（每次发版覆盖，不按 tag 累加）
          UPDATER_URL_TEMPLATE: "https://gitee.com/${{ secrets.GITEE_REPOSITORY }}/raw/releases/latest/{filename}"
          UPDATER_OUTPUT_FILENAME: "updater-gitee.json"

      - name: 校验 updater-gitee.json（若已生成）
        shell: pwsh
        run: |
          if (-not (Test-Path dist/updater-gitee.json)) {
            Write-Host "⚠️ updater-gitee.json 未生成（Gitee 镜像未配置），跳过校验"
            exit 0
          }
          node scripts/verify-updater-json.mjs dist/updater-gitee.json

      # 可选性靠 continue-on-error 实现，不靠脚本里的 exit 0：
      #   旧实现包一层 try/catch，失败时 catch 里 exit 0 想做到"不影响发版"，
      #   但 PowerShell 的 catch 只接 cmdlet 的终止错误，git 这类原生命令返回非零
      #   **不会**进 catch（实测：native 失败 LASTEXITCODE=3 但不抛；cmdlet 失败才抛）。
      #   于是出现两种都错的结果：
      #     - git push 失败 → 不进 catch → 底下那句 "✅ 已镜像" 照样打印（日志骗人），
      #       同时 LASTEXITCODE 非零又把整个 run 弄红（v5.6.1 就是这样）；
      #     - 反过来某个 cmdlet 失败 → 进 catch → exit 0 → 绿灯，而镜像其实从没成功。
      #   现在：每个 git 调用后显式判 $LASTEXITCODE，失败就带原因 exit 1（步骤标红、
      #   一眼看得见），而 continue-on-error 保证它不拖累已发布的 GitHub Release。
      #   成功日志只在真推上去之后打印。
      - name: 镜像发布产物到 Gitee（国内加速，可选）
        shell: pwsh
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
        run: |
          # 不用 Stop：让流程走到我们自己的检查点，而不是被某个 cmdlet 的异常抢跑。
          $ErrorActionPreference = 'Continue'

          function Fail([string]$why) {
            Write-Host ""
            Write-Host "❌ Gitee 镜像未完成：$why"
            Write-Host "   GitHub Release 已正常发布，自动更新仍可走 ghproxy/GitHub 端点；"
            Write-Host "   只有 Gitee 国内加速通道这一次没更新。"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN) -or [string]::IsNullOrWhiteSpace($env:GITEE_REPOSITORY)) {
            Write-Host "⚠️ 未配置 GITEE_TOKEN/GITEE_REPOSITORY secret，跳过 Gitee 镜像发布"
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          # 仓库路径不是秘密，打出来：客户端硬编码的地址与这个 secret 不一致时，
          # 镜像会"成功"到一个没人读的仓库，不打印根本无法发现。
          Write-Host "目标 Gitee 仓库：$($env:GITEE_REPOSITORY)（分支 releases，目录 latest/）"

          $giteeUrl = "https://oauth2:$($env:GITEE_TOKEN)@gitee.com/$($env:GITEE_REPOSITORY).git"
          $mirrorDir = Join-Path $env:RUNNER_TEMP "gitee-mirror"

          git clone --depth 1 --branch releases $giteeUrl $mirrorDir 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ℹ️ releases 分支不存在（首次发布），改为 clone 默认分支后建孤儿分支"
            git clone --depth 1 $giteeUrl $mirrorDir 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { Fail "clone Gitee 仓库失败（查 GITEE_TOKEN 是否有写权限、GITEE_REPOSITORY 路径是否正确）" }
            if (-not (Test-Path $mirrorDir)) { Fail "clone 返回 0 但目录不存在：$mirrorDir" }
            Push-Location $mirrorDir
            git checkout --orphan releases 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { Pop-Location; Fail "创建 releases 孤儿分支失败" }
            git reset --hard 2>&1 | Write-Host
            Pop-Location
          }
          if (-not (Test-Path $mirrorDir)) { Fail "镜像工作目录不存在：$mirrorDir" }

          # 固定覆盖 latest/ 目录（不按 tag 累加）
          $destDir = Join-Path $mirrorDir "latest"
          if (Test-Path $destDir) { Remove-Item $destDir -Recurse -Force }
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $destDir/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig $destDir/ -ErrorAction SilentlyContinue
          Copy-Item dist/updater-gitee.json $destDir/ -ErrorAction SilentlyContinue

          # 体积和文件数必须打印：push 被重置时这是判断"是不是太大传不动"的唯一依据。
          $files = @(Get-ChildItem $destDir -Recurse -File)
          if ($files.Count -eq 0) { Fail "latest/ 里一个文件都没有（产物路径变了？上一步的 Copy-Item 全没匹配上）" }
          $mb = ($files | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("待推送 latest/：{0} 个文件，合计 {1:N2} MB" -f $files.Count, $mb)
          $files | ForEach-Object { Write-Host ("  - {0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB)) }

          Push-Location $mirrorDir
          git add -A latest 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Pop-Location; Fail "git add 失败" }
          git -c user.email="ci@pastepanda.local" -c user.name="pastepanda-ci" commit -m "release: mirror $tag to Gitee (latest)" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Pop-Location; Fail "git commit 失败（内容与上一版完全相同时也会非零）" }

          # 待传 pack 的真实体积（比文件体积更准：exe 几乎不可压缩）
          Write-Host "--- git count-objects ---"
          git count-objects -vH 2>&1 | Write-Host

          # 诊断开关：只在这一步打开。
          #   GIT_CURL_VERBOSE → HTTP 层细节，能看到连接在哪一步被重置；
          #   GIT_TRACE        → git 内部子命令与耗时；
          #   GIT_TRACE_CURL_NO_DATA → 只要头不要数据体，否则日志会被二进制淹没。
          # token 在 URL 里，但 GITEE_TOKEN 是 secret，GitHub 会自动打码成 ***。
          $env:GIT_CURL_VERBOSE = "1"
          $env:GIT_TRACE = "1"
          $env:GIT_TRACE_CURL_NO_DATA = "1"

          # 第一次：原样推（保留现场，不动任何参数）。
          # 耗时是关键区分信息：探针已测得 1KB 只需 20 秒、而 8MB 跑 25 分钟不完，
          # 所以这里要把秒数、退出码、均速都打出来。
          Write-Host "====== 第一次 push（默认参数） ======"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          git push --progress --verbose origin releases 2>&1 | Write-Host
          $pushCode = $LASTEXITCODE
          $sw.Stop()
          $sec1 = [int]$sw.Elapsed.TotalSeconds
          Write-Host ("第一次 push：退出码 {0}，耗时 {1} 秒" -f $pushCode, $sec1)
          if ($sec1 -gt 0) { Write-Host ("  均速约 {0:N0} KB/s" -f ($mb * 1024 / $sec1)) }

          # 第二次（仅在失败时）：同时试两个针对 "RPC failed / curl 55" 的经典改法，
          # 把它们放在同一次 run 里验证，省得为了试一个参数再发一版：
          #   http.postBuffer=500MB → 不用 chunked 上传（很多反代处理不好 chunked）
          #   --no-thin             → 不发 thin pack（部分服务端对 thin pack 会断连）
          if ($pushCode -ne 0) {
            Write-Host ""
            Write-Host "====== 第二次 push（http.postBuffer=500MB + --no-thin） ======"
            $sw2 = [System.Diagnostics.Stopwatch]::StartNew()
            git -c http.postBuffer=524288000 push --no-thin --progress --verbose origin releases 2>&1 | Write-Host
            $pushCode2 = $LASTEXITCODE
            $sw2.Stop()
            $sec2 = [int]$sw2.Elapsed.TotalSeconds
            Write-Host ("第二次 push：退出码 {0}，耗时 {1} 秒" -f $pushCode2, $sec2)
            # annotation 会进入 run 的 annotations，可以不看完整日志就拿到关键数字
            Write-Host ("::error title=Gitee 镜像诊断::pack={0:N2}MB files={1} push1_code={2} push1_sec={3} push2_code={4} push2_sec={5}" -f $mb, $files.Count, $pushCode, $sec1, $pushCode2, $sec2)
            if ($pushCode2 -eq 0) {
              Write-Host "✅ 第二次成功 —— 说明 postBuffer/--no-thin 能绕过这个问题，应该直接加到默认参数里"
              $pushCode = 0
            }
          } else {
            Write-Host ("::notice title=Gitee 镜像::推送成功 pack={0:N2}MB files={1} sec={2}" -f $mb, $files.Count, $sec1)
          }
          Pop-Location
          if ($pushCode -ne 0) { Fail "git push 两次都失败（见上方 GIT_CURL_VERBOSE 输出：连接在哪一步被重置、传了多少字节）" }

          Write-Host "✅ 已推送到 Gitee releases 分支：$tag"

          # 推完立即验证客户端那个地址真的读得到——“推成功”不等于“能用”。
          # 探针已验：raw 会 302 跳到 raw.giteeusercontent.com，所以必须跟随重定向。
          $raw = "https://gitee.com/$($env:GITEE_REPOSITORY)/raw/releases/latest/updater-gitee.json"
          Write-Host "--- 验证 $raw ---"
          try {
            $resp = Invoke-WebRequest -Uri $raw -MaximumRedirection 5 -TimeoutSec 60 -UseBasicParsing
            Write-Host ("raw 返回 {0}，长度 {1} 字节" -f $resp.StatusCode, $resp.RawContentLength)
            if ($resp.StatusCode -ne 200) { Fail "raw URL 返回 $($resp.StatusCode)，客户端同样读不到" }
          } catch {
            Fail "raw URL 请求失败：$_（推上去了却读不到，客户端一样用不了）"
          }
          Write-Host "✅ raw URL 可读，国内加速通道本次确实生效"
