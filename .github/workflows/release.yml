name: Release
run-name: ${{ github.ref_name }} - ${{ github.event.head_commit.message }}

# 当推送 v* 格式的 tag 时触发（如 v5.0.37）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 5.0.37）"
        required: true

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔑 准备签名密钥（文件路径方式）
        shell: pwsh
        run: |
          $raw = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          $keyFile = "${{ runner.temp }}\tauri-signing.key"

          # 写入密钥文件（二进制安全）
          [System.IO.File]::WriteAllText($keyFile, $raw, [System.Text.Encoding]::ASCII)

          # 验证文件
          $content = Get-Content $keyFile -Raw
          $expectedPrefix = 'dW50cnVzdGVk'
          $expectedLength = 348

          Write-Host "========================================"
          Write-Host "  密钥验证"
          Write-Host "========================================"
          Write-Host "Secret 长度: $($raw.Length)"
          Write-Host "文件长度: $($content.Length)"
          Write-Host "期望长度: $expectedLength"
          Write-Host "以 '$expectedPrefix' 开头: $($content.StartsWith($expectedPrefix))"

          if ($content.Length -ne $expectedLength -or -not $content.StartsWith($expectedPrefix)) {
            Write-Host "`n❌ 密钥格式不正确!"
            Write-Host "前30字符: $($content.Substring(0, [Math]::Min(30, $content.Length)))"
            Write-Host "`n修复: 去 GitHub Secrets 更新 TAURI_SIGNING_PRIVATE_KEY"
            Write-Host "值必须以 'dW50cnVzdGVk' 开头, 长度 348 字符"
            Write-Host "正确值来自: npx tauri signer generate --ci 生成的 .key 文件"
            exit 1
          }

          try {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($content))
            if ($decoded.StartsWith('untrusted comment: rsign encrypted secret key')) {
              Write-Host "✅ 密钥验证通过 (minisign 格式)"
            } else {
              Write-Host "❌ 解码后格式不对: $($decoded.Substring(0, [Math]::Min(40, $decoded.Length)))"
              exit 1
            }
          } catch {
            Write-Host "❌ Base64 解码失败: $($_.Exception.Message)"
            exit 1
          }

          # 设置文件路径供后续步骤使用
          "TAURI_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
          Write-Host "密钥文件: $keyFile"
          Write-Host "========================================"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 sccache 缓存
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: 安装前端依赖
        run: |
          rm package-lock.json -ErrorAction SilentlyContinue
          rm -r node_modules -ErrorAction SilentlyContinue
          npm install

      - name: 🔍 校验手册下载链接版本
        shell: pwsh
        run: |
          $confVer = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tagVer = "${{ github.event.inputs.version }}"
          } else {
            $tagVer = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          $html = Get-Content docs/manual/index.html -Raw
          # ❗ 目录是 tag（带 v），文件名**不带 v**：CI 从 v7.0.0 起资产名一直是
          # PastePanda_7.x.x_x64-setup.exe（2026-09-10 用 v7.1.4 Release 实测）。
          $expected = "releases/download/v${confVer}/PastePanda_${confVer}_x64-setup.exe"
          if ($html -notmatch [regex]::Escape($expected)) {
            Write-Host "❌ 手册下载链接版本与 tauri.conf.json 不一致 (conf=$confVer)"
            $m = [regex]::Match($html, "releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/PastePanda_v?([0-9]+\.[0-9]+\.[0-9]+)_x64-setup\.exe")
            if ($m.Success) { Write-Host "   手册链接 tag=v$($m.Groups[1].Value) 文件名版本=$($m.Groups[2].Value)" }
            elseif ($html.Contains("{{PP_VERSION}}")) { Write-Host "   手册仍为占位符 {{PP_VERSION}}，请先本地 npm run prebuild 注入版本再发版" }
            exit 1
          }

          if ($confVer -ne $tagVer) {
            Write-Host "❌ tauri.conf.json 版本 ($confVer) 与 tag ($tagVer) 不一致"
            exit 1
          }

          Write-Host "✅ 版本校验通过: conf=tag=$confVer，手册下载链接一致"

      - name: 缓存 MNN 预编译（避免每次构建联网下载 180MB）
        uses: actions/cache@v4
        with:
          path: src-tauri/vendor/ocr-rs/3rd_party/prebuilt
          key: ${{ runner.os }}-mnn-prebuilt-dev
          restore-keys: ${{ runner.os }}-mnn-prebuilt-

      - name: 构建 Tauri 应用
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_KEY_FILE
          npx tauri build

      - name: 列出构建产物（调试）
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== nsis 目录 ==="
          if (Test-Path src-tauri/target/release/bundle/nsis/) {
            Get-ChildItem src-tauri/target/release/bundle/nsis/
          } else {
            Write-Host "nsis 目录不存在"
          }
          Write-Host ""
          Write-Host "=== 查找 .sig 文件 ==="
          $sigFiles = Get-ChildItem -Recurse src-tauri/target/release/bundle/ -Filter "*.sig" -ErrorAction SilentlyContinue
          if ($sigFiles) { $sigFiles } else { Write-Host "未找到 .sig 文件" }
          Write-Host ""
          Write-Host "=== 查找 .exe 文件 ==="
          $exeFiles = Get-ChildItem -Recurse src-tauri/target/release/bundle/ -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) { $exeFiles } else { Write-Host "未找到 .exe 文件" }

      - name: 打包绿色便携版
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = "src-tauri/target/release/PastePanda.exe"
          $zipName = "PastePanda_$version`_x86_64-pc-windows-msvc.zip"

          if (-not (Test-Path $exePath)) {
            Write-Host "❌ 绿色版 exe 不存在: $exePath"
            exit 1
          }

          $exeDir = Split-Path $exePath -Parent
          $exeName = Split-Path $exePath -Leaf
          $zipFullPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Push-Location $exeDir
          Compress-Archive -Path $exeName -DestinationPath $zipFullPath -Force
          Pop-Location

          Write-Host "✅ 绿色版打包完成: $zipName"
          Write-Host "文件大小: $((Get-Item $zipFullPath).Length / 1MB) MB"

      - name: 提取更新日志
        id: changelog
        # 用 Node 脚本替代内联 pwsh 正则：UTF-8 读取 + /\r?\n/ 分行，免疫
        # Windows runner autocrlf 检出产生的 CRLF（v5.1.2/v5.2.0 曾因此提取
        # 失败回退"常规构建发布"）。段落缺失/为空时脚本 exit 1 红灯中止发版，
        # 不再静默兜底。输出 release_body / updater_notes 写入 GITHUB_OUTPUT。
        run: node scripts/extract-release-notes.mjs

      - name: 生成 updater.json（ghproxy 镜像下载源）
        run: node scripts/generate-updater-json.mjs
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_NOTES: ${{ steps.changelog.outputs.updater_notes }}
          UPDATER_DOWNLOAD_BASE: "https://github.com/${{ github.repository }}/releases/download"

      - name: 校验 updater.json（发布前冒烟，防止坏产物静默发布）
        run: node scripts/verify-updater-json.mjs dist/updater.json

      # ─── ghproxy 代理源的单独 manifest ───
      # 🔴 为什么要单独生一份，而不是把上面那份的 URL 改成 ghproxy：
      #   Tauri 的 manifest 每个平台**只能写一个 `url`**。而 tauri.conf.json 里
      #   第 2、3 条 endpoint（ghproxy 与 GitHub 直连）如果指向同一个文件，
      #   ghproxy 就只代理了那 3KB 的 manifest，里面 22MB 的 exe 地址仍然是直连 GitHub——
      #   对连不上 GitHub 的用户而言这个兑底根本不兑底（b91d1e9 只修到一半的地方）。
      #   现在三个源各自自洽：manifest 在哪台主机，exe 就也在那台主机。
      # ❗ 同一个 exe，签名不变，只是多一条取文件的路——minisign 公钥校验不受影响。
      - name: 生成 updater-ghproxy.json（ghproxy 代理下载源）
        run: node scripts/generate-updater-json.mjs
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_NOTES: ${{ steps.changelog.outputs.updater_notes }}
          UPDATER_URL_TEMPLATE: "https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/{tag}/{filename}"
          UPDATER_OUTPUT_FILENAME: "updater-ghproxy.json"

      - name: 校验 updater-ghproxy.json
        run: node scripts/verify-updater-json.mjs dist/updater-ghproxy.json

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🐼 PastePanda ${{ github.ref_name }}"
          body: |
            ## 🐼 PastePanda ${{ github.ref_name }}

            > 智能剪贴板管理器 — 轻量、高效、美观

            ---

            ${{ steps.changelog.outputs.release_body }}

            ---

            ### ⚠️ 升级提醒
            - 升级后所有设置和剪贴板数据保持不变，无需额外操作

            ---

            ### 📦 下载
            - **安装版**：下载 `PastePanda_*_x64-setup.exe`，运行安装程序（支持自动更新）
            - **绿色便携版**：下载 `PastePanda_*_x86_64-pc-windows-msvc.zip`，解压即用（更新后变为已安装状态）

            ---

            <sub>🤖 本 Release 由 CI 根据 commit 前缀自动生成 | [提交规范](#)：`feat:` 新功能 · `chg:` 变更 · `fix:` 修复 · `refactor:` 重构 · `docs:` 文档</sub>
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            PastePanda_*_x86_64-pc-windows-msvc.zip
            dist/updater.json
            dist/updater-ghproxy.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      # ─── Gitee 镜像同步（可选，解决国内用户直连 GitHub 不稳定问题）───
      # 两个 secret（GITEE_TOKEN/GITEE_REPOSITORY）未配置时自动跳过，不影响现有发版流程。

      - name: 生成 updater-gitee.json（Gitee 镜像 manifest，可选）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.GITEE_REPOSITORY }}")) {
            Write-Host "⚠️ 未配置 GITEE_REPOSITORY secret，跳过 Gitee 镜像 manifest 生成"
            exit 0
          }
          node scripts/generate-updater-json.mjs
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_NOTES: ${{ steps.changelog.outputs.updater_notes }}
          # Gitee raw 对大文件（安装包 ~20MB）要求登录才能下载（"large file require login"），
          # app 没有 Gitee 登录态会被 403，所以二进制不能走 raw。改用 Gitee 发行版资源
          # releases/download/{tag}/{filename}：发行版资源公开可下、不要求登录，正好绕过 raw 登录墙。
          # manifest（JSON 小文件）仍走 raw/releases/latest/（无需登录）。
          UPDATER_URL_TEMPLATE: "https://gitee.com/${{ secrets.GITEE_REPOSITORY }}/releases/download/{tag}/{filename}"
          UPDATER_OUTPUT_FILENAME: "updater-gitee.json"

      - name: 校验 updater-gitee.json（若已生成）
        shell: pwsh
        run: |
          if (-not (Test-Path dist/updater-gitee.json)) {
            Write-Host "⚠️ updater-gitee.json 未生成（Gitee 镜像未配置），跳过校验"
            exit 0
          }
          node scripts/verify-updater-json.mjs dist/updater-gitee.json

      # 可选性靠 continue-on-error 实现，不靠脚本里的 exit 0：
      #   旧实现包一层 try/catch，失败时 catch 里 exit 0 想做到"不影响发版"，
      #   但 PowerShell 的 catch 只接 cmdlet 的终止错误，git 这类原生命令返回非零
      #   **不会**进 catch（实测：native 失败 LASTEXITCODE=3 但不抛；cmdlet 失败才抛）。
      #   于是出现两种都错的结果：
      #     - git push 失败 → 不进 catch → 底下那句 "✅ 已镜像" 照样打印（日志骗人），
      #       同时 LASTEXITCODE 非零又把整个 run 弄红（v5.6.1 就是这样）；
      #     - 反过来某个 cmdlet 失败 → 进 catch → exit 0 → 绿灯，而镜像其实从没成功。
      #   现在：每个 git 调用后显式判 $LASTEXITCODE，失败就带原因 exit 1（步骤标红、
      #   一眼看得见），而 continue-on-error 保证它不拖累已发布的 GitHub Release。
      #   成功日志只在真推上去之后打印。
      - name: 上传安装包到 Gitee 发行版（国内加速，可选）
        shell: pwsh
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
        run: |
          # 不用 Stop：让流程走到我们自己的检查点，而不是被某个 cmdlet 的异常抢跑。
          $ErrorActionPreference = 'Continue'

          function Fail([string]$why) {
            Write-Host ""
            Write-Host "❌ Gitee 镜像未完成：$why"
            Write-Host "   GitHub Release 已正常发布，自动更新仍可走 ghproxy/GitHub 端点；"
            Write-Host "   只有 Gitee 国内加速通道这一次没更新。"
            exit 1
          }

          # 分别检测两个 secret，明确报出「哪个为空」，避免「条目在但值为空」这种看不见的坑
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) { $missing += 'GITEE_TOKEN' }
          if ([string]::IsNullOrWhiteSpace($env:GITEE_REPOSITORY)) { $missing += 'GITEE_REPOSITORY' }
          if ($missing.Count -gt 0) {
            Write-Host ("⚠️ 未配置 secret（值为空）：{0}，跳过 Gitee 镜像发布" -f ($missing -join ' / '))
            Write-Host "   排查：GitHub 仓库 Settings → Secrets and variables → Actions 中，确认上述条目「存在且值非空」。"
            Write-Host "   注意：secret 列表里有条目 ≠ 值非空；空字符串/纯空格会被 [string]::IsNullOrWhiteSpace 判为未配置。"
            Write-Host "   GITEE_REPOSITORY 是非敏感值，可改放在 Repository variables 并以 fallback 读取，便于肉眼确认非空。"
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          # 仓库路径不是秘密，打出来：客户端硬编码的地址与这个 secret 不一致时，
          # 镜像会"成功"到一个没人读的仓库，不打印根本无法发现。
          Write-Host "目标 Gitee 仓库：$($env:GITEE_REPOSITORY)（发行版附件 releases/download/{tag}/）"

          $giteeUrl = "https://oauth2:$($env:GITEE_TOKEN)@gitee.com/$($env:GITEE_REPOSITORY).git"

          # ── 二进制走 Gitee 发行版（releases/download/{tag}）───
          # raw 对大文件要求登录（app 无登录态会被 403），发行版资源公开可下、无需登录，
          # 正好绕过。流程：推 tag → 取/建发行版 → 上传 exe+.sig → 验证可下载。
          Write-Host "--- 发布二进制到 Gitee 发行版（绕过 raw 登录墙）---"
          $apiBase = "https://gitee.com/api/v5/repos/$($env:GITEE_REPOSITORY)"
          $token = $env:GITEE_TOKEN.Trim()
          $headers = @{ "Authorization" = "token $token" }

          # 1) 推 tag 到 Gitee（发行版需 tag 存在；已存在则强制覆盖，避免 already exists 被拒）
          #    禁用 husky pre-push 钩子，避免镜像步骤里白跑整套测试门禁（v7.0.0 曾浪费 ~9 分钟）
          git -c core.hooksPath="$env:TEMP" push -f "$giteeUrl" "$tag" 2>&1 | Write-Host
          Write-Host ("tag {0} 推送完成（exit={1}，已存在则忽略）" -f $tag, $LASTEXITCODE)

          # 2) 取已有发行版或新建（token 走 Authorization 头，不落 query string / 日志）
          $rel = $null
          try {
            $rel = Invoke-RestMethod -Uri "$apiBase/releases/tags/$tag" -Headers $headers -Method Get -TimeoutSec 30 -ErrorAction Stop
          } catch { }
          if ($rel -and $rel.id) {
            Write-Host ("发行版已存在（id={0}），复用" -f $rel.id)
          } else {
            $relBody = @{ tag_name = $tag; name = "PastePanda $tag"; body = "PastePanda $tag 自动发布（国内加速通道）"; prerelease = $false; target_commitish = "${{ github.sha }}" } | ConvertTo-Json -Compress
            try {
              $rel = Invoke-RestMethod -Uri "$apiBase/releases" -Headers $headers -Method Post -Body $relBody -ContentType "application/json" -TimeoutSec 30 -ErrorAction Stop
            } catch {
              Fail ("创建 Gitee 发行版失败：{0}" -f $_)
            }
            Write-Host ("已创建发行版（id={0}）" -f $rel.id)
          }
          $rid = $rel.id
          if (-not $rid) { Fail "未取得发行版 id" }

          # 3) 上传 exe + .sig 资源（multipart，字段名 file）
          #    🔴 接口名是 attach_files，**不是 GitHub 那个 assets**。
          #    实探结论（2026-09-06）：同一个发行版 id 下
          #      POST .../releases/{id}/assets       → 404，返回的是 Gitee 网页版 HTML 错误页
          #      POST .../releases/{id}/attach_files → 401 JSON（路由存在，只是 token 不对）
          #    换 access_token 查询串还是 Authorization 头都一样，说明与鉴权方式无关。
          #    ❗ 读写两边名字不一样：**上传**叫 attach_files，而下面第 4 步回读时
          #      发行版 JSON 里的字段确实叫 assets——这正是当初写错的原因，别又改回去。
          #    --fail-with-body：4xx/5xx 令 curl 非零退出（避免「假成功」漏传 exe），
          #      同时**把 Gitee 的错误正文打出来**。光用 --fail 只能看到一个光秃秃的
          #      HTTP 404，根本分不出是路径错了、仓库错了还是发行版 id 错了。
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/nsis"
          foreach ($pattern in @("*.exe", "*.exe.sig")) {
            $af = Get-Item (Join-Path $nsisDir $pattern) -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $af) { Write-Host ("跳过（未找到）: {0}" -f $pattern); continue }
            Write-Host ("上传资源: {0} ({1} MB)" -f $af.Name, ([int]($af.Length / 1MB)))
            # 21MB 走 Gitee 国际线路常超 5 分钟；放宽到 30 分钟并加重试，避免 curl exit 28 超时把 exe 漏传
            curl.exe -sS --fail-with-body -w "HTTP %{http_code}\n" -X POST "$apiBase/releases/$rid/attach_files" -H "Authorization: token $token" -F "file=@$($af.FullName)" --max-time 1800 --retry 3 --retry-delay 10 --retry-all-errors
            if ($LASTEXITCODE -ne 0) { Fail ("上传资源 {0} 失败（curl exit {1}）" -f $af.Name, $LASTEXITCODE) }
            Write-Host ("  ✅ 已上传 {0}" -f $af.Name)
          }

          # 4) 验证不假绿：回读发行版 .assets，确认 exe 真在（缺失则真 Fail，不让 job 假绿）
          #    带 4 次退避重试，规避 Gitee 新资产/CDN 传播延迟（v7.0.0 只查一次误判失败）
          $binOk = $false
          for ($i = 1; $i -le 4; $i++) {
            try {
              $relChk = Invoke-RestMethod -Uri "$apiBase/releases/$rid" -Headers $headers -Method Get -TimeoutSec 30 -ErrorAction Stop
              $assetNames = @($relChk.assets | ForEach-Object { $_.name })
              Write-Host ("验证尝试 {0}/4 资产: {1}" -f $i, ($assetNames -join ", "))
              if (($assetNames | Where-Object { $_ -like "*.exe" }).Count -gt 0) { $binOk = $true; break }
            } catch {
              Write-Host ("验证读取失败: {0}" -f $_)
            }
            if ($i -lt 4) { Start-Sleep -Seconds ($i * 5) }
          }
          if (-not $binOk) { Fail "安装包未真正上传到 Gitee 发行版附件（exe 不在 .assets，国内下载加速未生效）" }
          Write-Host "✅ 发行版 .assets 含 exe，app 国内通道生效"

      # ─── manifest 出境：GitHub 的 releases 分支（2026-10-10 改）───
      # 这条分支以前是手工建在 **Gitee** 上的孤儿分支。Gitee 的「仓库镜像管理」同步的是 GitHub 的
      # 整个分支集合，并按「删除在远程仓库中不存在的分支和标签」剪枝 ⇒ 每推一次 GitHub 就剪一次，
      # 客户端第 1 更新源跟着 404（实测 09:03:53Z 推 GitHub → 09:04:08Z 同步完成 → 分支消失）。
      # 现在分支建在 GitHub 上：镜像不会剪它，还会替我们搬到 Gitee（同步 4–11s，raw 边缘再 20–100s）。
      # 顺序上放在二进制之后：manifest 一旦上线，里面那条 releases/download/{tag}/*.exe 必须已经可下。
      - name: 发布 updater-gitee.json 到 GitHub releases 分支（Gitee 由镜像同步搬运）
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path dist/updater-gitee.json)) {
            Write-Host "⚠️ dist/updater-gitee.json 不存在（Gitee 镜像未配置或生成步骤被跳过），本次不发 manifest"
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:GITEE_REPOSITORY)) {
            Write-Host "❌ 缺 GITEE_REPOSITORY：客户端硬编码读的是那个 Gitee 仓库，没有它就没法验证搬运结果"
            exit 1
          }
          # 这个脚本是唯一出口：FF 提交到 GitHub 的 releases/latest/，然后按
          # 「GitHub sha → Gitee 分支 sha → raw 读得到」三段验证；卡在哪一段就打印哪一段。
          node scripts/publish-manifest-branch.mjs --file dist/updater-gitee.json --gitee-repo $env:GITEE_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ manifest 未确认到达 Gitee（第 1 更新源这次可能仍旧 404，自愈工作流会补）"
            exit 1
          }
          Write-Host "✅ releases 分支已更新，Gitee 侧三份证据全绿"
