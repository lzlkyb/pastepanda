name: Sync Gitee & Rebuild Pages

# 国内用户访问手册/源码走 Gitee：每次 push master 后
#   ① 轮询等待 Gitee 仓库 master 同步到本次提交（依赖已有 GitHub→Gitee 同步机制）
#   ② 调用 Gitee Pages 构建 API 自动重新部署（无需手动点「更新」）
# 依赖 secrets：GITEE_TOKEN / GITEE_REPOSITORY（release.yml 已配置，缺失时自动跳过）
# 前置条件（一次性）：Gitee 实名认证 + 仓库「服务 → Gitee Pages」手动点一次「启动」

on:
  push:
    branches: [master]
  workflow_dispatch: # 手动触发：改完 Pages 配置后可手动重建

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: ① 等待 Gitee 同步到本次提交
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPOSITORY" ]; then
            echo "⚠️ 未配置 GITEE_TOKEN/GITEE_REPOSITORY，跳过 Gitee Pages 更新"
            exit 0
          fi
          echo "目标 Gitee 仓库：$GITEE_REPOSITORY（轮询 master 最新 commit == $GITHUB_SHA）"
          # Gitee master 是保护分支（禁止 force push），代码同步走用户已有的 GitHub→Gitee 同步；
          # 这里只轮询等待同步到位，再触发 Pages 重建，避免部署旧代码。
          for i in $(seq 1 30); do
            http=$(curl -sS -o /tmp/gitee-commits.json -w "%{http_code}" \
              "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/commits/master?access_token=${GITEE_TOKEN}&per_page=1")
            echo "  commit API HTTP $http ($i/30)"
            if [ "$http" != "200" ]; then
              cat /tmp/gitee-commits.json 2>/dev/null | head -c 300; echo ""
            fi
            # Gitee /commits/{branch} 返回单个 commit 对象（非数组），取 .sha
            sha=$(jq -r '.sha // empty' /tmp/gitee-commits.json 2>/dev/null || true)
            if [ -z "$sha" ]; then
              echo "  (commits 响应前 220 字符): $(head -c 220 /tmp/gitee-commits.json)"
            fi
            if [ -n "$sha" ] && [ "$sha" = "$GITHUB_SHA" ]; then
              echo "✅ Gitee master 已同步到 $sha"
              exit 0
            fi
            echo "  等待同步… gitee=${sha:0:8} github=${GITHUB_SHA:0:8}"
            sleep 10
          done
          echo "❌ 300 秒内 Gitee 未同步到本次提交，请检查 Gitee 平台的 GitHub 同步配置；"
          echo "   同步完成后可手动重跑本任务（workflow_dispatch）触发 Pages 重建。"
          exit 1

      - name: ② 触发 Gitee Pages 重新部署
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPOSITORY" ]; then
            echo "⚠️ 未配置 Gitee secrets，跳过 Pages 更新（需手动在 Gitee 点「更新」）"
            exit 0
          fi
          # Gitee Pages 构建 API（需先在 Gitee 手动「启动」过一次 Pages 服务）
          code=$(curl -sS -o /tmp/gitee-pages-resp.txt -w "%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/pages/builds" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\"}")
          echo "HTTP $code"
          cat /tmp/gitee-pages-resp.txt
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "❌ Gitee Pages 构建触发失败（HTTP $code）。可能原因："
            echo "   - HTTP 404 = Gitee Pages 服务尚未启动：仓库 → 服务 → Gitee Pages → 实名认证 → 选分支/目录 → 点「启动」（仅首次一次）"
            echo "   - Gitee Pages 免费版要求仓库公开，私有仓库无法启用 Pages"
            echo "   - 触发过于频繁（Gitee 限制 1 分钟一次），可稍后手动点「更新」或重跑本任务"
            echo "   - 启动后可在 GitHub Actions 手动重跑本任务（workflow_dispatch）立即验证"
            exit 1
          fi
          echo "✅ Gitee Pages 已在后台重建（通常几分钟生效）"
